<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swing Terminal — Swing Trading Decision Support</title>
<meta name="description" content="Institutional-grade offline swing trading decision support system for Indian equities." />
<style>
/* ===== css/styles.css ===== */
/* ==========================================================================
   SWING TERMINAL — Design Tokens & Base Styles
   Institutional dark trading workstation aesthetic.
   ========================================================================== */

:root {
  /* ---- Color: cool near-black terminal, gold data accent, teal/red directional ---- */
  --bg-void: #090B10;
  --bg-panel: #10141C;
  --bg-panel-raised: #171C27;
  --bg-panel-hover: #1D2330;
  --border-hair: #232A38;
  --border-strong: #303A4D;

  --text-primary: #E7EBF3;
  --text-secondary: #AAB4C6;
  --text-muted: #6C7690;
  --text-faint: #4A5265;

  --accent-gold: #C9A24B;
  --accent-gold-dim: #8A7238;
  --accent-teal: #2FBF9F;
  --accent-teal-dim: #1B6E5C;
  --accent-red: #E5534B;
  --accent-red-dim: #8C332D;
  --accent-blue: #4C8DFF;
  --accent-violet: #9B7EDE;

  --score-excellent: #2FBF9F;
  --score-good: #7FBF4B;
  --score-fair: #C9A24B;
  --score-weak: #C97A3A;
  --score-poor: #E5534B;

  /* ---- Type ---- */
  --font-display: "Segoe UI Semibold", ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-body: ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Code", "SF Mono", "Consolas", "Roboto Mono", monospace;

  --radius-sm: 3px;
  --radius-md: 6px;
  --radius-lg: 10px;

  --shadow-panel: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px rgba(0,0,0,0.35);
  --transition-fast: 120ms ease;
  --transition-med: 220ms ease;

  --sidebar-w: 216px;
  --ribbon-h: 44px;
}

/* ---- Reset ---- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg-void);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0 0 8px; letter-spacing: -0.01em; font-weight: 600; }
p { margin: 0 0 8px; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--accent-blue); text-decoration: none; }
a:hover { text-decoration: underline; }
ul { margin: 0; padding: 0; list-style: none; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-void); }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

:focus-visible {
  outline: 2px solid var(--accent-gold);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ---- App shell ---- */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: minmax(var(--ribbon-h), auto) 1fr;
  grid-template-areas:
    "sidebar ribbon"
    "sidebar main";
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* ---- Sidebar ---- */
.sidebar {
  grid-area: sidebar;
  background: var(--bg-panel);
  border-right: 1px solid var(--border-hair);
  display: flex;
  flex-direction: column;
  padding: 14px 10px;
  overflow-y: auto;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 4px 10px 16px;
  border-bottom: 1px solid var(--border-hair);
  margin-bottom: 10px;
}
.brand-mark { color: var(--accent-gold); font-family: var(--font-mono); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
.brand-sub { color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }

.nav-group-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-faint);
  padding: 14px 10px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  background: transparent;
  border: none;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  cursor: pointer;
  text-align: left;
  transition: background var(--transition-fast), color var(--transition-fast);
}
.nav-item:hover { background: var(--bg-panel-hover); color: var(--text-primary); }
.nav-item.is-active {
  background: var(--bg-panel-raised);
  color: var(--text-primary);
  box-shadow: inset 2px 0 0 var(--accent-gold);
}
.nav-icon { width: 16px; text-align: center; font-family: var(--font-mono); color: var(--text-faint); }
.nav-item.is-active .nav-icon { color: var(--accent-gold); }
.nav-badge {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--bg-void);
  border: 1px solid var(--border-strong);
  color: var(--text-muted);
  padding: 1px 6px;
  border-radius: 10px;
}

.sidebar-footer {
  margin-top: auto;
  padding: 10px;
  font-size: 11px;
  color: var(--text-faint);
  border-top: 1px solid var(--border-hair);
}

/* ---- Ribbon (index snapshot ticker) ---- */
.ribbon {
  grid-area: ribbon;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border-hair);
  display: flex;
  align-items: stretch;
  overflow-x: auto;
  white-space: nowrap;
}
.ribbon .tradingview-widget-container { width: 100%; flex: 1; }
.ribbon-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  border-right: 1px solid var(--border-hair);
  font-family: var(--font-mono);
  font-size: 12px;
}
.ribbon-name { color: var(--text-muted); }
.ribbon-value { color: var(--text-primary); font-weight: 600; }
.ribbon-delta { font-weight: 600; }
.ribbon-delta.up { color: var(--accent-teal); }
.ribbon-delta.down { color: var(--accent-red); }
.ribbon-item.vix .ribbon-value { color: var(--accent-violet); }

/* ---- Main ---- */
.main {
  grid-area: main;
  overflow-y: auto;
  padding: 20px 22px 48px;
}
.view { display: none; }
.view.is-active { display: block; animation: fadeIn var(--transition-med); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

.view-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.view-title { font-size: 18px; }
.view-subtitle { color: var(--text-muted); font-size: 12px; }

/* ---- Panels / Cards ---- */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-hair);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-panel);
  padding: 16px;
}
.panel + .panel { margin-top: 16px; }
.panel-title {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-muted);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 720px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .app-shell {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr;
    grid-template-areas:
      "ribbon"
      "sidebar"
      "main";
    height: 100dvh;
  }
  .sidebar {
    flex-direction: row;
    align-items: center;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 6px 8px;
    border-right: none;
    border-bottom: 1px solid var(--border-hair);
    -webkit-overflow-scrolling: touch;
  }
  .brand, .sidebar-footer, .nav-group-label { display: none; }
  .nav-item {
    flex: 0 0 auto;
    white-space: nowrap;
    margin-right: 4px;
  }
  .nav-item.is-active { box-shadow: inset 0 -2px 0 var(--accent-gold); }
  .ribbon { overflow-x: auto; }
}

/* ---- Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-strong);
  background: var(--bg-panel-raised);
  color: var(--text-primary);
  cursor: pointer;
  transition: background var(--transition-fast), border-color var(--transition-fast);
  font-weight: 500;
}
.btn:hover { background: var(--bg-panel-hover); border-color: var(--text-faint); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent-gold); border-color: var(--accent-gold); color: #1A1305; font-weight: 600; }
.btn-primary:hover { background: #D9B562; }
.btn-danger { border-color: var(--accent-red-dim); color: var(--accent-red); background: transparent; }
.btn-danger:hover { background: rgba(229,83,75,0.1); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-panel-hover); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ---- Forms ---- */
label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.field { margin-bottom: 12px; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%;
  background: var(--bg-void);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 8px 10px;
  color: var(--text-primary);
}
input:focus, select:focus, textarea:focus { border-color: var(--accent-gold); }
textarea { min-height: 70px; resize: vertical; }

/* ---- Tables ---- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-strong);
  cursor: pointer;
  white-space: nowrap;
}
th:hover { color: var(--text-secondary); }
td { padding: 9px 10px; border-bottom: 1px solid var(--border-hair); font-family: var(--font-mono); white-space: nowrap; }
tr.candidate-row { cursor: pointer; transition: background var(--transition-fast); }
tr.candidate-row:hover { background: var(--bg-panel-hover); }
tr.candidate-row.is-selected { background: var(--bg-panel-raised); box-shadow: inset 2px 0 0 var(--accent-gold); }

.mono { font-family: var(--font-mono); }
.txt-muted { color: var(--text-muted); }
.txt-teal { color: var(--accent-teal); }
.txt-red { color: var(--accent-red); }
.txt-gold { color: var(--accent-gold); }

/* ---- Badges / pills ---- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 2px 7px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.badge-long { color: var(--accent-teal); border-color: var(--accent-teal-dim); background: rgba(47,191,159,0.08); }
.badge-short { color: var(--accent-red); border-color: var(--accent-red-dim); background: rgba(229,83,75,0.08); }
.badge-watch { color: var(--text-muted); }

/* ---- Score dial (signature element) ---- */
.score-dial {
  --pct: 0;
  --dial-color: var(--score-fair);
  width: 46px; height: 46px;
  border-radius: 50%;
  background: conic-gradient(var(--dial-color) calc(var(--pct) * 1%), var(--border-hair) 0);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.score-dial-inner {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg-panel);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-weight: 700; font-size: 12px;
}

/* ---- Empty / loading states ---- */
.empty-state, .loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  color: var(--text-muted);
  text-align: center;
  gap: 8px;
}
.empty-state-icon { font-size: 28px; color: var(--text-faint); font-family: var(--font-mono); }
.spinner {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  border-top-color: var(--accent-gold);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- Toast ---- */
#toast-root { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.toast {
  background: var(--bg-panel-raised);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent-gold);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  font-size: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  animation: fadeIn var(--transition-med);
}
.toast.success { border-left-color: var(--accent-teal); }
.toast.error { border-left-color: var(--accent-red); }

/* ---- Checklist ---- */
.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 4px;
  border-bottom: 1px solid var(--border-hair);
}
.checklist-item:last-child { border-bottom: none; }
.checklist-item input[type="checkbox"] { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--accent-gold); }
.checklist-item.critical .checklist-label::after {
  content: "critical";
  margin-left: 8px;
  font-size: 9px;
  color: var(--accent-red);
  text-transform: uppercase;
  border: 1px solid var(--accent-red-dim);
  padding: 1px 5px;
  border-radius: 8px;
}
.checklist-item.failed { background: rgba(229,83,75,0.06); }

/* ---- Tooltip ---- */
[data-tip] { position: relative; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: 125%; left: 50%; transform: translateX(-50%);
  background: var(--bg-panel-raised);
  border: 1px solid var(--border-strong);
  padding: 6px 9px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  color: var(--text-secondary);
  white-space: nowrap;
  z-index: 50;
}

/* ---- Utility ---- */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.w-full { width: 100%; }
.text-right { text-align: right; }


/* ===== css/components.css ===== */
/* ==========================================================================
   Component styles
   ========================================================================== */

/* ---- Dropzone (Scanner Import) ---- */
.dropzone {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 36px 20px;
  text-align: center;
  color: var(--text-muted);
  transition: border-color var(--transition-fast), background var(--transition-fast);
  cursor: pointer;
}
.dropzone.is-dragover { border-color: var(--accent-gold); background: rgba(201,162,75,0.06); color: var(--text-primary); }
.dropzone input[type="file"] { display: none; }
.dropzone-icon { font-size: 26px; font-family: var(--font-mono); color: var(--accent-gold); margin-bottom: 8px; }

.paste-area { margin-top: 12px; }

.import-summary { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; }
.import-stat { font-family: var(--font-mono); font-size: 12px; }
.import-stat b { display: block; font-size: 18px; color: var(--text-primary); }

/* ---- Scanner library cards ---- */
.scanner-card {
  border: 1px solid var(--border-hair);
  border-radius: var(--radius-md);
  padding: 12px;
  background: var(--bg-panel-raised);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.scanner-card-title { font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.scanner-card-desc { font-size: 12px; color: var(--text-muted); }
.scanner-card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

/* ---- Tabs ---- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-hair); margin-bottom: 14px; }
.tab-btn {
  background: transparent; border: none; color: var(--text-muted);
  padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent;
  font-weight: 500;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.is-active { color: var(--accent-gold); border-bottom-color: var(--accent-gold); }
.tab-panel { display: none; }
.tab-panel.is-active { display: block; }

/* ---- Trade workspace layout ---- */
.workspace-layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 16px;
  align-items: start;
}
@media (max-width: 1100px) { .workspace-layout { grid-template-columns: 1fr; } }

.tv-timeframes { display: flex; gap: 6px; margin-bottom: 10px; }
.tv-chart-wrap { border: 1px solid var(--border-hair); border-radius: var(--radius-md); overflow: hidden; background: #0d1117; }
.tv-chart-wrap iframe, .tv-chart-wrap > div { width: 100%; }

.plan-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-hair); font-size: 13px; }
.plan-row:last-child { border-bottom: none; }
.plan-row .label { color: var(--text-muted); }
.plan-row .value { font-family: var(--font-mono); font-weight: 600; }

/* ---- Modal ---- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(4,6,10,0.65);
  display: flex; align-items: center; justify-content: center; z-index: 150;
}
.modal { background: var(--bg-panel-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); width: min(480px, 92vw); max-height: 86vh; overflow-y: auto; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; }

/* ---- Journal ---- */
.journal-entry {
  border: 1px solid var(--border-hair); border-radius: var(--radius-md);
  padding: 12px; margin-bottom: 10px; background: var(--bg-panel-raised);
}
.journal-entry-header { display: flex; justify-content: space-between; align-items: center; }
.journal-pnl.pos { color: var(--accent-teal); }
.journal-pnl.neg { color: var(--accent-red); }

/* ---- Analytics stat cards ---- */
.stat-card { text-align: center; }
.stat-value { font-family: var(--font-mono); font-size: 24px; font-weight: 700; }
.stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
.stat-value.pos { color: var(--accent-teal); }
.stat-value.neg { color: var(--accent-red); }

/* ---- Heat map placeholder ---- */
.heatmap-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.heatmap-cell {
  border-radius: var(--radius-sm); padding: 8px 6px; font-size: 11px;
  font-family: var(--font-mono); text-align: center; color: #0A0D12; font-weight: 700;
}

/* ---- Weight sliders (scoring config) ---- */
.weight-row { display: grid; grid-template-columns: 140px 1fr 46px; gap: 10px; align-items: center; margin-bottom: 10px; }
.weight-row input[type="range"] { accent-color: var(--accent-gold); }

/* ---- Sector strength bars ---- */
.sector-bar-row { display: grid; grid-template-columns: 110px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 6px; }
.sector-bar-track { height: 8px; background: var(--bg-void); border-radius: 4px; overflow: hidden; }
.sector-bar-fill { height: 100%; border-radius: 4px; }

</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">SWING·TERMINAL</span>
    </div>
    <div class="brand-sub" style="padding:0 10px 10px;">NSE / BSE Decision Support</div>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      Decision support only.<br />No trade recommendations or guarantees.
    </div>
  </aside>

  <div id="ribbon" class="ribbon" aria-label="Index snapshot"></div>

  <main id="main-content" class="main"></main>
</div>

<div id="toast-root" aria-live="polite"></div>

<script>
/* ===== js/utils.js ===== */
/**
 * utils.js
 * Framework-free helper functions shared across modules.
 * No external dependencies — keeps the app fully offline-capable.
 */

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

/* ---------------------------------------------------------------------- */
/* Number / currency formatting                                           */
/* ---------------------------------------------------------------------- */

function fmtINR(value, decimals = 2) {
  if (value === null || value === undefined || isNaN(value)) return "—";
  return Number(value).toLocaleString("en-IN", {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });
}

function fmtCr(value) {
  if (value === null || value === undefined || isNaN(value)) return "—";
  return (Number(value) / 10000000).toFixed(2) + " Cr";
}

function fmtPct(value, decimals = 1) {
  if (value === null || value === undefined || isNaN(value)) return "—";
  const v = Number(value);
  return (v > 0 ? "+" : "") + v.toFixed(decimals) + "%";
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function uid(prefix = "id") {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

/* ---------------------------------------------------------------------- */
/* CSV parsing — handles quoted fields, commas-in-quotes, CRLF/LF          */
/* ---------------------------------------------------------------------- */

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  const pushField = () => { row.push(field); field = ""; };
  const pushRow = () => { rows.push(row); row = []; };

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") pushField();
      else if (c === "\r") { /* skip */ }
      else if (c === "\n") { pushField(); pushRow(); }
      else field += c;
    }
  }
  if (field.length || row.length) { pushField(); pushRow(); }

  const filtered = rows.filter((r) => r.some((cell) => cell.trim() !== ""));
  if (!filtered.length) return { headers: [], records: [] };

  const headers = filtered[0].map((h) => h.trim());
  const records = filtered.slice(1).map((r) => {
    const rec = {};
    headers.forEach((h, idx) => { rec[h] = (r[idx] ?? "").trim(); });
    return rec;
  });
  return { headers, records };
}

/** Normalize a raw scanner header name to a canonical field key. */
const HEADER_ALIASES = {
  symbol: "symbol", ticker: "symbol", "stock name": "symbol", nsecode: "symbol", "stock code": "symbol",
  name: "companyName", "company name": "companyName",
  close: "ltp", ltp: "ltp", price: "ltp", "close price": "ltp",
  volume: "volume", vol: "volume",
  "% chg": "changePct", "1 day % change": "changePct", change: "changePct", chg: "changePct",
  sector: "sector", industry: "sector",
  "52whigh": "high52w", "52w high": "high52w",
  "52wlow": "low52w", "52w low": "low52w",
  "sma50": "sma50", "50 day sma": "sma50",
  "sma200": "sma200", "200 day sma": "sma200",
  rsi: "rsi", "rsi 14": "rsi",
  "eps growth": "epsGrowth", "eps qtr growth %": "epsGrowth", "eps growth %": "epsGrowth", "quarterly eps growth": "epsGrowth",
  "sales growth": "salesGrowth", "sales growth %": "salesGrowth", "quarterly sales growth": "salesGrowth",
  "roe": "roe", "return on equity": "roe",
  "rs rating": "rsRating", "relative strength rating": "rsRating", "ibd rs rating": "rsRating",
};

function normalizeHeader(h) {
  const key = h.trim().toLowerCase();
  return HEADER_ALIASES[key] || h.trim();
}

function normalizeRecord(rec) {
  const out = {};
  for (const [k, v] of Object.entries(rec)) {
    out[normalizeHeader(k)] = v;
  }
  return out;
}

function toNumber(v) {
  if (v === null || v === undefined) return NaN;
  const cleaned = String(v).replace(/,/g, "").replace(/%/g, "").trim();
  return cleaned === "" ? NaN : Number(cleaned);
}

/* ---------------------------------------------------------------------- */
/* Toast notifications                                                     */
/* ---------------------------------------------------------------------- */

function toast(message, type = "info", ms = 3200) {
  const root = $("#toast-root");
  if (!root) return;
  const node = el("div", { class: `toast ${type}` }, message);
  root.appendChild(node);
  setTimeout(() => node.remove(), ms);
}

/* ---------------------------------------------------------------------- */
/* Debounce                                                                */
/* ---------------------------------------------------------------------- */

function debounce(fn, wait = 200) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), wait);
  };
}

/**
 * storage.js
 * Thin abstraction over persistence. Everything in the app reads/writes
 * through this module — swap the internals later (IndexedDB, REST API,
 * broker backend, mobile SQLite bridge) without touching feature code.
 */

const NAMESPACE = "swingTerminal.v1";

function key(name) { return `${NAMESPACE}.${name}`; }

const Store = {
  get(name, fallback = null) {
    try {
      const raw = localStorage.getItem(key(name));
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      console.error(`Store.get failed for ${name}`, e);
      return fallback;
    }
  },
  set(name, value) {
    try {
      localStorage.setItem(key(name), JSON.stringify(value));
      return true;
    } catch (e) {
      console.error(`Store.set failed for ${name}`, e);
      return false;
    }
  },
  remove(name) {
    localStorage.removeItem(key(name));
  },
  /** Export the entire app state as a single JSON blob (for backup / migration). */
  exportAll() {
    const out = {};
    for (const k of Object.keys(localStorage)) {
      if (k.startsWith(NAMESPACE)) out[k.slice(NAMESPACE.length + 1)] = JSON.parse(localStorage.getItem(k));
    }
    return out;
  },
  importAll(obj) {
    for (const [k, v] of Object.entries(obj)) this.set(k, v);
  },
};

/** Shared "Live · <date>" / "Demo data" badge used across every view that shows synced data. */
function liveBadge(isLive, asOf) {
  return el("span", { class: `badge ${isLive ? "badge-long" : ""}`, style: "text-transform:none; letter-spacing:0;" },
    isLive ? `Live${asOf ? " · " + asOf : ""}` : "Demo data — see Settings to sync real data");
}

const LIVE_DATA_CACHE = {};
const LIVE_DATA_CACHE_MS = 5 * 60 * 1000; // 5 min — this data only changes once/day anyway

function getLiveDataBaseUrl() {
  const url = Store.get(KEYS.LIVE_DATA_URL, "");
  return url ? url.replace(/\/$/, "") : "";
}

function saveLiveDataBaseUrl(url) {
  Store.set(KEYS.LIVE_DATA_URL, (url || "").trim().replace(/\/$/, ""));
}

function isLiveDataConfigured() {
  return !!getLiveDataBaseUrl();
}

async function fetchLiveJson(filename) {
  const base = getLiveDataBaseUrl();
  if (!base) return null;

  const cached = LIVE_DATA_CACHE[filename];
  if (cached && Date.now() - cached.fetchedAt < LIVE_DATA_CACHE_MS) return cached.data;

  try {
    const res = await fetch(`${base}/data/live/${filename}?t=${Math.floor(Date.now() / 600000)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    LIVE_DATA_CACHE[filename] = { data, fetchedAt: Date.now() };
    return data;
  } catch (err) {
    console.warn(`liveDataService: could not fetch ${filename}`, err);
    return null;
  }
}

/**

 * ---------------------------------------------------------------------
 * Abstracted market-data provider. Every value the Dashboard shows comes
 * through this module so no market figures are hard-coded into the UI.

 * TODAY: returns realistic static/randomized sample data (offline demo).
 * FUTURE: replace the body of each function with a real call to an

function jitter(base, spread) {
  return base + (Math.random() * 2 - 1) * spread;
}

/**
 * Computes an overall market-context bias ("supportive" / "unsupportive" /
 * "neutral" for longs) from the index snapshot, and caches it in Store for
 * the rest of the session. The scoring engine reads this synchronously via
 * Store.get(KEYS.MARKET_BIAS, ...) — call this once at app startup (and
 * again whenever the user wants a fresh read) rather than on every score
 * calculation, since getIndexSnapshot() is randomized sample data here and
 * would otherwise make scores flicker between renders.
 */
/**
 * Pure computation of market-context bias from an already-fetched index
 * snapshot + breadth reading (avoids re-fetching, which would jitter to a
 * different random sample and disagree with what the ribbon just showed).
 */
function computeMarketBias(snapshot, breadth) {
  const nifty = snapshot.find((s) => s.name === "NIFTY 50");
  const vix = snapshot.find((s) => s.isVix);
  let score = 0;
  if (nifty && nifty.changePct > 0.2) score += 1;
  if (nifty && nifty.changePct < -0.2) score -= 1;
  if (breadth.adRatio >= 1.2) score += 1;
  if (breadth.adRatio <= 0.8) score -= 1;
  if (vix && vix.value >= 18) score -= 1; // elevated fear works against fresh longs
  return score >= 1 ? "supportive" : score <= -1 ? "unsupportive" : "neutral";
}

/**
 * Fetches a fresh index snapshot + breadth reading, computes the bias, and
 * caches it in Store for the rest of the session. The scoring engine reads
 * this synchronously via Store.get(KEYS.MARKET_BIAS, ...) — call this once
 * at app startup (see app.js) rather than on every score calculation,
 * since getIndexSnapshot() is randomized sample data here and would
 * otherwise make scores flicker between renders.
 */
async function refreshMarketBias() {
  const [snapshot, breadth] = await Promise.all([getIndexSnapshot(), getMarketBreadth()]);
  const bias = computeMarketBias(snapshot, breadth);
  Store.set(KEYS.MARKET_BIAS, bias);
  return bias;
}

/** Same as refreshMarketBias() but reuses a snapshot the caller already fetched. */
async function refreshMarketBiasFromSnapshot(snapshot) {
  const breadth = await getMarketBreadth();
  const bias = computeMarketBias(snapshot, breadth);
  Store.set(KEYS.MARKET_BIAS, bias);
  return bias;
}

function getCachedMarketBias() {
  return Store.get(KEYS.MARKET_BIAS, "neutral");

/** Market breadth (advance/decline) for the dashboard. Uses real synced
 *  NSE-wide data if a live data URL is configured (see Settings), else
 *  falls back to demo values. */
async function getMarketBreadth() {
  const live = await getLiveBreadth();
  if (live) {
    return {
      advances: live.advances, declines: live.declines, unchanged: live.unchanged,
      adRatio: live.adRatio, newHighs: live.newHighs, newLows: live.newLows,
      isLive: true, asOf: live.asOf,
    };
  }
  const advances = Math.round(jitter(1450, 250));
  const declines = Math.round(jitter(1150, 250));
  const unchanged = Math.round(jitter(90, 20));
  return { advances, declines, unchanged, adRatio: +(advances / Math.max(declines, 1)).toFixed(2), isLive: false };
}

  return sectors
    .map((name) => ({ name, relativeStrength: +jitter(0, 3.2).toFixed(2), isLive: false }))

}

/* ===== js/modules/scoring.js ===== */
/**
 * scoring.js
 * ---------------------------------------------------------------------
 * Techno-funda scoring engine, built around the analysis frameworks named
 * in this project's brief: Weinstein Stage Analysis for trend context,
 * Minervini-style VCP for base/contraction quality, O'Neil/CANSLIM-style
 * relative strength and (where fundamental columns are present) earnings
 * growth, and Darvas-style proximity-to-pivot logic for breakouts.
 *
 * KEY DESIGN CHOICE: long and short setups are scored with two SEPARATE,
 * direction-appropriate sub-score sets — a short candidate is not simply
 * "1 minus the long score". A stock can score high as a genuine breakdown
 * (falling trend, weak relative strength, distribution volume, rejected
 * at resistance) independent of how it scores on bullish criteria. The
 * candidate's bias is whichever direction has the stronger, more complete
 * technical case, and its displayed composite score reflects the quality
 * of THAT setup — this is what should differentiate real trade candidates
 * from noise, and what should show up over time in the Analytics module
 * as fewer, better trades and a shallower drawdown.
 *
 * Every score is 0-100 and is an OBJECTIVE summary of the fields present
 * on the row (technicals from the scanner export, plus optional
 * fundamental columns like EPS/sales growth or ROE if your Chartink
 * scanner outputs them). It does not predict future price movement.
 * ---------------------------------------------------------------------
 */

const DEFAULT_WEIGHTS = {
  trend: 14,
  relativeStrength: 11,
  volume: 9,
  liquidity: 7,
  proximityToExtreme: 9,
  momentum: 11,
  baseQuality: 10,
  breakoutQuality: 10,
  riskReward: 9,
  fundamentals: 6,
  marketContext: 4,
};

function getWeights() {
  const stored = Store.get(KEYS.SCORING_WEIGHTS);
  return stored && Object.keys(stored).length ? stored : { ...DEFAULT_WEIGHTS };
}

function saveWeights(weights) {
  Store.set(KEYS.SCORING_WEIGHTS, weights);
}

function weightSum(weights) {
  return Object.values(weights).reduce((a, b) => a + Number(b || 0), 0);
}

/* ---------------------------------------------------------------------- */
/* Shared helpers                                                          */
/* ---------------------------------------------------------------------- */

function haveAll(c, fields) {
  return fields.every((f) => !isNaN(toNumber(c[f])));
}

/** How many of the fields the scoring model actually uses were present on this row (0-1). */
function dataCompleteness(c) {
  const fields = ["ltp", "changePct", "volume", "avgVolume20", "high52w", "low52w", "sma50", "sma200", "rsi"];
  const present = fields.filter((f) => c[f] !== undefined && c[f] !== "" && !(typeof c[f] === "number" && isNaN(c[f])));
  return +(present.length / fields.length).toFixed(2);
}

/** Optional CANSLIM-lite fundamentals — neutral (50) when the scanner export doesn't include them. */
function scoreFundamentals(c, direction) {
  const eps = toNumber(c.epsGrowth), sales = toNumber(c.salesGrowth), roe = toNumber(c.roe);
  const have = [eps, sales, roe].filter((v) => !isNaN(v));
  if (!have.length) return 50;
  let score = 50;
  if (!isNaN(eps)) score += (direction === "long" ? eps : -eps) * 1.2;
  if (!isNaN(sales)) score += (direction === "long" ? sales : -sales) * 0.8;
  if (!isNaN(roe)) score += (direction === "long" ? (roe - 15) : (15 - roe)) * 1.0;
  return clamp(Math.round(score), 0, 100);
}

/** Market-context adjustment: is the broader tape helping or fighting this trade direction? */
function scoreMarketContext(direction) {
  const bias = Store.get(KEYS.MARKET_BIAS, "neutral");
  if (bias === "neutral") return 50;
  const supportive = bias === "supportive";
  if (direction === "long") return supportive ? 80 : 25;
  return supportive ? 25 : 80; // a supportive tape works against fresh shorts, and vice versa
}

/* ---------------------------------------------------------------------- */
/* LONG-side sub-scores                                                    */
/* ---------------------------------------------------------------------- */

function scoreTrendLong(c) {
  const close = toNumber(c.ltp), sma50 = toNumber(c.sma50), sma200 = toNumber(c.sma200);
  if (haveAll(c, ["ltp", "sma50", "sma200"])) {
    let s = 30;
    if (close > sma50) s += 25;
    if (close > sma200) s += 20;
    if (sma50 > sma200) s += 25; // Weinstein Stage 2 structure
    return clamp(s, 0, 100);
  }
  const chg = toNumber(c.changePct);
  return isNaN(chg) ? 50 : clamp(50 + chg * 5, 0, 100);
}

function scoreRelativeStrengthLong(c) {
  if (!isNaN(toNumber(c.rsRating))) return clamp(toNumber(c.rsRating), 0, 100);
  const chg = toNumber(c.changePct);
  return isNaN(chg) ? 50 : clamp(50 + chg * 8, 0, 100);
}

function scoreVolumeLong(c) {
  const vol = toNumber(c.volume), avgVol = toNumber(c.avgVolume20), chg = toNumber(c.changePct);
  if (!isNaN(vol) && !isNaN(avgVol) && avgVol > 0) {
    const ratio = vol / avgVol;
    let s = clamp((ratio - 0.5) * 55, 0, 100);
    if (!isNaN(chg) && chg > 0 && ratio > 1.2) s = clamp(s + 10, 0, 100); // up-move on strong volume = accumulation
    return s;
  }
  return 50;
}

function scoreLiquidity(c) {
  const vol = toNumber(c.volume), price = toNumber(c.ltp);
  if (isNaN(vol) || isNaN(price)) return 50;
  const turnoverCr = (vol * price) / 10000000;
  return clamp(turnoverCr * 10, 0, 100);
}

function scoreProximityToHigh(c) {
  const close = toNumber(c.ltp), high = toNumber(c.high52w);
  if (isNaN(close) || isNaN(high) || high === 0) return 50;
  return clamp(((close / high) * 100 - 60) * 2.5, 0, 100);
}

function scoreMomentumLong(c) {
  const rsi = toNumber(c.rsi);
  if (!isNaN(rsi)) {
    if (rsi >= 55 && rsi <= 70) return 100;
    if (rsi > 70 && rsi <= 80) return 70;
    if (rsi > 80) return 35;
    if (rsi >= 45 && rsi < 55) return 55;
    return 25;
  }
  const chg = toNumber(c.changePct);
  return isNaN(chg) ? 50 : clamp(50 + chg * 6, 0, 100);
}

/** Minervini VCP-style: tighter range relative to its own 52-week spread scores higher. */
function scoreBaseQuality(c) {
  const high = toNumber(c.high52w), low = toNumber(c.low52w);
  if (isNaN(high) || isNaN(low) || high === 0) return 50;
  const range = (high - low) / high;
  return clamp(100 - range * 100, 0, 100);
}

function scoreBreakoutQualityLong(c) {
  const close = toNumber(c.ltp), high = toNumber(c.high52w), vol = toNumber(c.volume), avgVol = toNumber(c.avgVolume20);
  if (isNaN(close) || isNaN(high)) return 50;
  const nearHigh = close >= 0.97 * high;
  const volConfirm = !isNaN(vol) && !isNaN(avgVol) && avgVol > 0 && vol > 1.3 * avgVol;
  if (nearHigh && volConfirm) return 100;
  if (nearHigh) return 65;
  if (volConfirm) return 55;
  return 35;
}

function scoreRiskRewardLong(c) {
  const close = toNumber(c.ltp), sma50 = toNumber(c.sma50), high = toNumber(c.high52w);
  if (isNaN(close)) return 50;
  const stopProxy = !isNaN(sma50) ? sma50 : close * 0.93;
  const targetProxy = !isNaN(high) ? high * 1.1 : close * 1.15;
  const risk = Math.abs(close - stopProxy);
  if (risk === 0) return 50;
  const reward = Math.abs(targetProxy - close);
  return clamp((reward / risk) * 25, 0, 100);
}

/* ---------------------------------------------------------------------- */
/* SHORT-side sub-scores (mirrored logic, not just "100 - long")           */
/* ---------------------------------------------------------------------- */

function scoreTrendShort(c) {
  const close = toNumber(c.ltp), sma50 = toNumber(c.sma50), sma200 = toNumber(c.sma200);
  if (haveAll(c, ["ltp", "sma50", "sma200"])) {
    let s = 30;
    if (close < sma50) s += 25;
    if (close < sma200) s += 20;
    if (sma50 < sma200) s += 25; // Weinstein Stage 4 structure
    return clamp(s, 0, 100);
  }
  const chg = toNumber(c.changePct);
  return isNaN(chg) ? 50 : clamp(50 - chg * 5, 0, 100);
}

function scoreRelativeWeakness(c) {
  if (!isNaN(toNumber(c.rsRating))) return clamp(100 - toNumber(c.rsRating), 0, 100);
  const chg = toNumber(c.changePct);
  return isNaN(chg) ? 50 : clamp(50 - chg * 8, 0, 100);
}

function scoreDistributionVolume(c) {
  const vol = toNumber(c.volume), avgVol = toNumber(c.avgVolume20), chg = toNumber(c.changePct);
  if (!isNaN(vol) && !isNaN(avgVol) && avgVol > 0) {
    const ratio = vol / avgVol;
    let s = clamp((ratio - 0.5) * 55, 0, 100);
    if (!isNaN(chg) && chg < 0 && ratio > 1.2) s = clamp(s + 10, 0, 100); // down-move on strong volume = distribution
    return s;
  }
  return 50;
}

function scoreProximityToLow(c) {
  const close = toNumber(c.ltp), low = toNumber(c.low52w);
  if (isNaN(close) || isNaN(low) || close === 0) return 50;
  return clamp((140 - (close / low) * 100) * 2.5, 0, 100);
}

function scoreMomentumShort(c) {
  const rsi = toNumber(c.rsi);
  if (!isNaN(rsi)) {
    if (rsi <= 45 && rsi >= 30) return 100;
    if (rsi < 30) return 70; // deeply oversold — still a valid breakdown continuation, less fresh
    if (rsi > 45 && rsi <= 55) return 55;
    return 25;
  }
  const chg = toNumber(c.changePct);
  return isNaN(chg) ? 50 : clamp(50 - chg * 6, 0, 100);
}

function scoreBreakdownQuality(c) {
  const close = toNumber(c.ltp), low = toNumber(c.low52w), vol = toNumber(c.volume), avgVol = toNumber(c.avgVolume20);
  if (isNaN(close) || isNaN(low)) return 50;
  const nearLow = close <= 1.03 * low;
  const volConfirm = !isNaN(vol) && !isNaN(avgVol) && avgVol > 0 && vol > 1.3 * avgVol;
  if (nearLow && volConfirm) return 100;
  if (nearLow) return 65;
  if (volConfirm) return 55;
  return 35;
}

function scoreRiskRewardShort(c) {
  const close = toNumber(c.ltp), sma50 = toNumber(c.sma50), low = toNumber(c.low52w);
  if (isNaN(close)) return 50;
  const stopProxy = !isNaN(sma50) ? sma50 : close * 1.07; // stop above resistance for a short
  const targetProxy = !isNaN(low) ? low * 0.9 : close * 0.85;
  const risk = Math.abs(stopProxy - close);
  if (risk === 0) return 50;
  const reward = Math.abs(close - targetProxy);
  return clamp((reward / risk) * 25, 0, 100);
}

/* ---------------------------------------------------------------------- */
/* Composite: score both directions, keep the stronger, more complete one  */
/* ---------------------------------------------------------------------- */

function weightedComposite(sub, weights) {
  const totalWeight = weightSum(weights) || 1;
  let total = 0;
  for (const [key, val] of Object.entries(sub)) total += (val * (Number(weights[key]) || 0)) / totalWeight;
  return clamp(Math.round(total), 0, 100);
}

function scoreCandidate(candidate, weights = getWeights()) {
  const longSub = {
    trend: scoreTrendLong(candidate),
    relativeStrength: scoreRelativeStrengthLong(candidate),
    volume: scoreVolumeLong(candidate),
    liquidity: scoreLiquidity(candidate),
    proximityToExtreme: scoreProximityToHigh(candidate),
    momentum: scoreMomentumLong(candidate),
    baseQuality: scoreBaseQuality(candidate),
    breakoutQuality: scoreBreakoutQualityLong(candidate),
    riskReward: scoreRiskRewardLong(candidate),
    fundamentals: scoreFundamentals(candidate, "long"),
    marketContext: scoreMarketContext("long"),
  };
  const shortSub = {
    trend: scoreTrendShort(candidate),
    relativeStrength: scoreRelativeWeakness(candidate),
    volume: scoreDistributionVolume(candidate),
    liquidity: scoreLiquidity(candidate),
    proximityToExtreme: scoreProximityToLow(candidate),
    momentum: scoreMomentumShort(candidate),
    baseQuality: scoreBaseQuality(candidate),
    breakoutQuality: scoreBreakdownQuality(candidate),
    riskReward: scoreRiskRewardShort(candidate),
    fundamentals: scoreFundamentals(candidate, "short"),
    marketContext: scoreMarketContext("short"),
  };

  const longComposite = weightedComposite(longSub, weights);
  const shortComposite = weightedComposite(shortSub, weights);

  // A small margin avoids flipping bias on noise when both sides look similarly mediocre.
  const bias = longComposite >= shortComposite ? "long" : "short";
  const composite = bias === "long" ? longComposite : shortComposite;
  const subScores = bias === "long" ? longSub : shortSub;

  return {
    subScores,
    composite,
    bias,
    longComposite,
    shortComposite,
    completeness: dataCompleteness(candidate),
  };
}

function scoreLabel(score) {
  if (score >= 80) return { label: "Excellent", cssVar: "--score-excellent" };
  if (score >= 65) return { label: "Good", cssVar: "--score-good" };
  if (score >= 50) return { label: "Fair", cssVar: "--score-fair" };
  if (score >= 35) return { label: "Weak", cssVar: "--score-weak" };
  return { label: "Poor", cssVar: "--score-poor" };
}

/**
 * checklist.js
 * Objective go/no-go checklist applied to every candidate before it is
 * accepted into the journal. Critical items failing should make the
 * trader stop and reconsider — the app visually flags this but the
 * final accept/reject decision always remains with the trader.
 */

const DEFAULT_CHECKLIST = [
  { id: "trend-aligned", label: "Trend aligned (price > 50 & 200 SMA, or clean downtrend for a short)", critical: true },
  { id: "long-term-avg", label: "Above (or below, for shorts) the long-term average with conviction", critical: true },
  { id: "liquidity", label: "Healthy liquidity — average turnover supports my position size", critical: true },
  { id: "proximity-resistance", label: "Not running straight into major overhead resistance", critical: false },
  { id: "overextended", label: "Not overextended (RSI / distance from moving average is reasonable)", critical: true },
  { id: "volume-confirmation", label: "Volume confirms the move (breakout/pullback volume as expected)", critical: false },
  { id: "sector-strong", label: "Sector / industry group is showing relative strength", critical: false },
  { id: "market-supportive", label: "Broader market context (Nifty trend, breadth, VIX) is supportive", critical: true },
  { id: "acceptable-rr", label: "Reward-to-risk is at least 2:1 at the planned stop and target", critical: true },
  { id: "position-sized", label: "Position size respects my max-risk-per-trade rule", critical: true },
];

/**
 * Evaluate a set of checked item ids against the checklist definition.
 * Returns pass/fail state plus whether any CRITICAL item failed.
 */
function evaluateChecklist(checkedIds = [], definition = DEFAULT_CHECKLIST) {
  const checkedSet = new Set(checkedIds);
  const results = definition.map((item) => ({ ...item, passed: checkedSet.has(item.id) }));
  const failedCritical = results.filter((r) => r.critical && !r.passed);
  const totalPassed = results.filter((r) => r.passed).length;
  return {
    results,
    totalPassed,
    totalItems: definition.length,
    hasCriticalFailure: failedCritical.length > 0,
    failedCritical,
  };
}

/**
 * riskManager.js
 * Pure calculation functions for position sizing and portfolio risk.
 * No side effects — easy to unit test and safe to reuse in a future
 * mobile app or server-side pre-trade check.
 */


const DEFAULT_RISK_SETTINGS = {
  capital: 1000000,
  maxRiskPerTradePct: 1.0,
  maxPortfolioExposurePct: 25,
};

function getRiskSettings() {
  return Store.get(KEYS.RISK_SETTINGS) || { ...DEFAULT_RISK_SETTINGS };
}
function saveRiskSettings(settings) {
  Store.set(KEYS.RISK_SETTINGS, settings);
}

/**
 * Compute position sizing for a single trade.
 * @param {number} capital - total trading capital
 * @param {number} maxRiskPerTradePct - e.g. 1 = 1% of capital
 * @param {number} entry - planned entry price
 * @param {number} stopLoss - planned stop-loss price
 */
function computePositionSize(capital, maxRiskPerTradePct, entry, stopLoss) {
  const riskPerShare = Math.abs(entry - stopLoss);
  if (!capital || !entry || !stopLoss || riskPerShare === 0) {
    return { quantity: 0, capitalRequired: 0, riskAmount: 0, riskPerShare: 0, portfolioPct: 0 };
  }
  const riskAmount = capital * (maxRiskPerTradePct / 100);
  const quantity = Math.floor(riskAmount / riskPerShare);
  const capitalRequired = quantity * entry;
  const portfolioPct = capital ? (capitalRequired / capital) * 100 : 0;
  return { quantity, capitalRequired, riskAmount, riskPerShare, portfolioPct };
}

function computeRewardRisk(entry, stopLoss, target) {
  const risk = Math.abs(entry - stopLoss);
  const reward = Math.abs(target - entry);
  if (risk === 0) return 0;
  return +(reward / risk).toFixed(2);
}

/**
 * Check a proposed new position against total open exposure to flag
 * portfolio-level risk breaches before the trade is journaled.
 */
function checkPortfolioExposure(openPositionsCapital, newPositionCapital, capital, maxPortfolioExposurePct) {
  const totalExposure = openPositionsCapital + newPositionCapital;
  const exposurePct = capital ? (totalExposure / capital) * 100 : 0;
  return {
    exposurePct: +exposurePct.toFixed(1),
    exceedsLimit: exposurePct > maxPortfolioExposurePct,
  };
}


/* ===== js/modules/candidates.js ===== */
/**
 * candidates.js
 * Holds the merged, de-duplicated candidate list produced by Scanner
 * Import, and exposes it (scored + ranked) to the rest of the app.
 *
 * Each import (a CSV file, a pasted table, or the sample data) is recorded
 * as an "import batch" with its own id. Every candidate remembers which
 * batch(es) contributed to it, so a single scanner's results can be
 * removed later without wiping out symbols that other scanners also
 * flagged (see removeImportBatch).
 */

const REQUIRED_FIELDS = ["symbol", "ltp"];

function getCandidates() {
  return Store.get(KEYS.CANDIDATES, []);
}

function saveCandidates(list) {
  Store.set(KEYS.CANDIDATES, list);
}

function clearCandidates() {
  Store.set(KEYS.CANDIDATES, []);
  Store.set(KEYS.IMPORT_BATCHES, []);
}

function getImportBatches() {
  return Store.get(KEYS.IMPORT_BATCHES, []);
}

function saveImportBatches(batches) {
  Store.set(KEYS.IMPORT_BATCHES, batches);
}

/**
 * Merge new raw records (from one Chartink scanner CSV, pasted table, or
 * the sample data set) into the existing candidate pool, de-duplicating
 * by symbol. Records this import as a new "batch" so it can be removed
 * as a unit later via removeImportBatch().
 */
function mergeCandidates(rawRecords, sourceName = "Imported") {
  const existing = getCandidates();
  const bySymbol = new Map(existing.map((c) => [c.symbol, c]));
  const missingRows = [];

  const batchId = uid("batch");
  const touchedSymbols = [];

  for (const raw of rawRecords) {
    const rec = normalizeRecord(raw);
    if (!rec.symbol) { missingRows.push(raw); continue; }
    rec.symbol = rec.symbol.toUpperCase().trim();

    const numericFields = [
      "ltp", "changePct", "volume", "avgVolume20", "high52w", "low52w",
      "sma50", "sma200", "rsi", "epsGrowth", "salesGrowth", "roe",
    ];
    numericFields.forEach((f) => { if (rec[f] !== undefined) rec[f] = toNumber(rec[f]); });

    touchedSymbols.push(rec.symbol);

    if (bySymbol.has(rec.symbol)) {
      const prior = bySymbol.get(rec.symbol);
      const priorBatches = prior.sourceBatches || [];
      bySymbol.set(rec.symbol, {
        ...prior,
        ...rec,
        id: prior.id,
        sourceBatches: priorBatches.includes(batchId) ? priorBatches : [...priorBatches, batchId],
      });
    } else {
      bySymbol.set(rec.symbol, { ...rec, id: uid("cand"), sourceBatches: [batchId], rejected: false });
    }
  }

  if (touchedSymbols.length) {
    const batches = getImportBatches();
    batches.push({ id: batchId, label: sourceName, timestamp: new Date().toISOString(), symbolCount: touchedSymbols.length });
    saveImportBatches(batches);
  }

  const merged = Array.from(bySymbol.values()).map((c) => ({ ...c, scannerSource: describeSources(c.sourceBatches) }));
  saveCandidates(merged);

  const incomplete = merged.filter((c) => REQUIRED_FIELDS.some((f) => c[f] === undefined || c[f] === "" || (typeof c[f] === "number" && isNaN(c[f]))));

  return {
    total: merged.length,
    added: rawRecords.length - missingRows.length,
    skipped: missingRows.length,
    incompleteCount: incomplete.length,
    batchId,
  };
}

/** Human-readable "which scanners flagged this stock" string, from batch ids. */
function describeSources(batchIds = []) {
  const batches = getImportBatches();
  const labels = batchIds
    .map((id) => batches.find((b) => b.id === id)?.label)
    .filter(Boolean);
  return Array.from(new Set(labels)).join(", ") || "Imported";
}

/**
 * Remove one entire import batch (e.g. one scanner's CSV). Candidates
 * that only came from this batch are deleted outright; candidates that
 * were also flagged by other scanners are kept, with this batch's
 * contribution simply removed from their source list.
 */
function removeImportBatch(batchId) {
  const remaining = getCandidates()
    .map((c) => ({ ...c, sourceBatches: (c.sourceBatches || []).filter((b) => b !== batchId) }))
    .filter((c) => c.sourceBatches.length > 0)
    .map((c) => ({ ...c, scannerSource: describeSources(c.sourceBatches) }));
  saveCandidates(remaining);
  saveImportBatches(getImportBatches().filter((b) => b.id !== batchId));
  return { remainingTotal: remaining.length };
}

/** Returns candidates scored + sorted highest composite score first.
 *  By default this excludes candidates the trader has explicitly rejected —
 *  pass { includeRejected: true } to see the full pool (e.g. for audit/history).
 */
function getRankedCandidates(weights, { includeRejected = false } = {}) {
  let list = getCandidates();
  if (!includeRejected) list = list.filter((c) => !c.rejected);
  return list
    .map((c) => ({ ...c, ...scoreCandidate(c, weights) }))
    .sort((a, b) => b.composite - a.composite);
}

/** Top N candidates for a given bias ("long" or "short"), auto-backfilling
 *  from the rest of the pool as candidates are rejected/removed. */
function getTopCandidates(bias, count = 10, weights) {
  return getRankedCandidates(weights).filter((c) => c.bias === bias).slice(0, count);
}

function getCandidateById(id) {
  return getCandidates().find((c) => c.id === id) || null;
}

function updateCandidate(id, patch) {
  const list = getCandidates().map((c) => (c.id === id ? { ...c, ...patch } : c));
  saveCandidates(list);
}

function removeCandidate(id) {
  saveCandidates(getCandidates().filter((c) => c.id !== id));
}

function rejectCandidate(id) {
  updateCandidate(id, { rejected: true });
}

function restoreCandidate(id) {
  updateCandidate(id, { rejected: false });
}


/* ===== js/modules/universeScanner.js ===== */
/**
 * universeScanner.js
 * ---------------------------------------------------------------------
 * Runs our own scanner definitions directly against the synced NSE
 * universe (price_history.json + full_universe.json, published by
 * tools/sync_market_data.py) — this is what replaces "manually run a
 * scanner on Chartink, export CSV, import it" with one click that scans
 * every single synced stock automatically.
 *
 * Each scanner below is a hand-written JS predicate that mirrors the
 * INTENT of the matching Chartink clause in js/data/scannerLibrary.js
 * (same underlying technical idea — trend, breakout, base quality, etc.)
 * — it's not a generic Chartink-syntax interpreter, just a direct
 * re-implementation of each of our 15 named setups, operating on
 * indicators derived client-side from the synced price history.
 *
 * Requires live data to be configured (Settings → Live Market Data
 * Sync) — with no universe synced yet, runUniverseScanners() returns a
 * clear "not configured" result rather than silently doing nothing.
 * ---------------------------------------------------------------------
 */

/* ---------------------------------------------------------------------- */
/* Indicator helpers — derive SMA/RSI/52w hi-lo from a symbol's price       */
/* history (bhavcopy alone only gives OHLCV, not indicators).               */
/* ---------------------------------------------------------------------- */

function sma(closes, period) {
  if (closes.length < period) return null;
  const window = closes.slice(-period);
  return window.reduce((a, b) => a + b, 0) / period;
}

function smaAt(closes, period, indexFromEnd) {
  // SMA as of `indexFromEnd` days ago (0 = latest) — used to detect "SMA is rising/falling".
  const end = closes.length - indexFromEnd;
  if (end < period) return null;
  const window = closes.slice(end - period, end);
  return window.reduce((a, b) => a + b, 0) / period;
}

function rsi14(closes) {
  const period = 14;
  if (closes.length < period + 1) return null;
  const changes = [];
  for (let i = closes.length - period; i < closes.length; i++) changes.push(closes[i] - closes[i - 1]);
  const gains = changes.filter((c) => c > 0);
  const losses = changes.filter((c) => c < 0).map((c) => -c);
  const avgGain = gains.reduce((a, b) => a + b, 0) / period;
  const avgLoss = losses.reduce((a, b) => a + b, 0) / period;
  if (avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return 100 - 100 / (1 + rs);
}

function ema(closes, period) {
  if (closes.length < period) return null;
  const k = 2 / (period + 1);
  let val = closes.slice(0, period).reduce((a, b) => a + b, 0) / period; // seed with SMA
  for (let i = period; i < closes.length; i++) val = closes[i] * k + val * (1 - k);
  return val;
}

function emaAt(closes, period, indexFromEnd) {
  const end = closes.length - indexFromEnd;
  if (end < period) return null;
  return ema(closes.slice(0, end), period);
}

function deriveIndicators(series) {
  // series: [{date, open, high, low, close, volume}, ...] oldest -> newest
  if (!series || series.length < 5) return null;
  const closes = series.map((d) => d.close);
  const volumes = series.map((d) => d.volume);
  const window52w = series.slice(-252);
  const today = series[series.length - 1];
  const yesterday = series.length > 1 ? series[series.length - 2] : today;

  const avgVol20 = volumes.length >= 20 ? volumes.slice(-20).reduce((a, b) => a + b, 0) / 20 : volumes.reduce((a, b) => a + b, 0) / volumes.length;

  // Recent N-day high/low range, used for flags/pennants (flagpole + tight flag) and horizontal resistance.
  const range = (n) => {
    const w = series.slice(-n);
    return { high: Math.max(...w.map((d) => d.high ?? d.close)), low: Math.min(...w.map((d) => d.low ?? d.close)) };
  };

  const hasOHLC = today.high !== undefined && today.high !== null && today.low !== undefined && today.low !== null;

  return {
    ltp: closes[closes.length - 1],
    prevClose: closes.length > 1 ? closes[closes.length - 2] : closes[closes.length - 1],
    todayOpen: today.open, todayHigh: today.high, todayLow: today.low,
    yesterdayHigh: yesterday.high, yesterdayLow: yesterday.low,
    volume: volumes[volumes.length - 1],
    avgVolume20: avgVol20,
    high52w: Math.max(...window52w.map((d) => d.close)),
    low52w: Math.min(...window52w.map((d) => d.close)),
    sma20: sma(closes, 20),
    sma50: sma(closes, 50),
    sma50Prev: smaAt(closes, 50, 5), // 5 sessions ago, to detect direction
    sma150: sma(closes, 150),
    sma200: sma(closes, 200),
    ema10: ema(closes, 10), ema10Prev: emaAt(closes, 10, 3),
    ema21: ema(closes, 21), ema21Prev: emaAt(closes, 21, 3),
    ema50: ema(closes, 50), ema50Prev: emaAt(closes, 50, 3),
    ema200: ema(closes, 200), ema200Prev: emaAt(closes, 200, 3),
    rsi: rsi14(closes),
    range5: hasOHLC ? range(5) : null,
    range10: hasOHLC ? range(10) : null,
    range20: hasOHLC ? range(20) : null,
    range40: hasOHLC ? range(40) : null,
    hasOHLC,
  };
}

/* ---------------------------------------------------------------------- */
/* Scanner predicates — mirror scannerLibrary.js intent, id-matched         */
/* ---------------------------------------------------------------------- */

const UNIVERSE_SCANNERS = {
  "trend-continuation": (ind) =>
    ind.sma50 && ind.sma200 && ind.ltp > ind.sma50 && ind.sma50 > ind.sma200 &&
    ind.ltp > ind.prevClose && ind.volume > ind.avgVolume20,

  "breakout": (ind) =>
    ind.high52w && ind.ltp >= 0.98 * ind.high52w && ind.volume > 1.5 * ind.avgVolume20 && ind.ltp > ind.prevClose,

  "pullback": (ind) =>
    ind.sma50 && ind.sma200 && ind.ltp > ind.sma200 &&
    ind.ltp <= 1.02 * ind.sma50 && ind.ltp >= 0.97 * ind.sma50 && ind.volume < ind.avgVolume20,

  "darvas-consolidation": (ind) =>
    ind.high52w && ind.ltp >= 0.95 * ind.high52w,

  "stage2-candidates": (ind) =>
    ind.sma50 && ind.sma150 && ind.sma200 && ind.ltp > ind.sma50 && ind.sma50 > ind.sma150 && ind.sma150 > ind.sma200 &&
    ind.low52w && ind.ltp >= 1.25 * ind.low52w,

  "momentum": (ind) =>
    ind.rsi && ind.rsi > 60 && ind.rsi < 80 && ind.volume > ind.avgVolume20,

  "high-rs": (ind) => ind.rsRating !== undefined && ind.rsRating !== null && ind.rsRating >= 80,

  "tight-consolidation": (ind) =>
    ind.sma50 && ind.volume < ind.avgVolume20 * 0.9,

  "ipo-base": (ind) =>
    ind.sma50 && ind.ltp > ind.sma50 && ind.low52w && ind.ltp < 1.15 * ind.low52w,

  "breakdown": (ind) =>
    ind.low52w && ind.ltp <= 1.02 * ind.low52w && ind.volume > 1.5 * ind.avgVolume20 && ind.ltp < ind.prevClose,

  "distribution-topping": (ind) =>
    ind.sma50 && ind.sma50Prev && ind.ltp < ind.sma50 && ind.sma50 < ind.sma50Prev &&
    ind.volume > 1.3 * ind.avgVolume20 && ind.ltp < ind.prevClose,

  "relative-weakness": (ind) => ind.rsRating !== undefined && ind.rsRating !== null && ind.rsRating <= 20,

  "downtrend-continuation": (ind) =>
    ind.sma50 && ind.sma150 && ind.sma200 && ind.ltp < ind.sma50 && ind.sma50 < ind.sma150 && ind.sma150 < ind.sma200 &&
    ind.high52w && ind.ltp <= 0.80 * ind.high52w,

  "bearish-rally-failure": (ind) =>
    ind.sma50 && ind.sma200 && ind.sma50Prev && ind.ltp < ind.sma200 && ind.sma50 < ind.sma50Prev &&
    ind.ltp >= 0.98 * ind.sma50 && ind.ltp <= 1.02 * ind.sma50 && ind.volume < ind.avgVolume20,

  /* ---- ChartsMaze-inspired additions ---- */

  "horizontal-resistance": (ind) =>
    ind.hasOHLC && ind.range40 &&
    ind.todayHigh >= 0.97 * ind.range40.high && ind.ltp < ind.range40.high &&  // pressing against a well-tested ceiling, not through it yet
    (ind.range40.high - ind.range40.low) / ind.range40.high < 0.25,            // that ceiling has been tested within a reasonably contained range

  "tight-setup-daily": (ind) =>
    ind.hasOHLC && ind.range10 &&
    (ind.range10.high - ind.range10.low) / ind.ltp < 0.06 &&   // <6% range over 10 sessions — genuinely tight
    ind.sma50 && ind.ltp > ind.sma50,

  "rs-high-before-price-high": (ind) =>
    ind.rsRating !== undefined && ind.rsRating !== null && ind.rsRating >= 85 &&
    ind.high52w && ind.ltp < 0.97 * ind.high52w && ind.ltp > (ind.sma50 || 0), // RS already elite, but price hasn't broken out yet — leading signal

  "volume-gainers": (ind) => ind.volume > 2 * ind.avgVolume20,

  "high-volume-stocks": (ind) => ind.volume > 3 * ind.avgVolume20 && ind.avgVolume20 > 50000,

  "volume-footprint": (ind) =>
    ind.hasOHLC && ind.volume > 2 * ind.avgVolume20 &&
    (ind.todayHigh - ind.todayLow) / ind.ltp < 0.03,   // big volume absorbed into a narrow range = footprint of accumulation/distribution

  "flags-pennants": (ind) => {
    if (!ind.hasOHLC || !ind.range20 || !ind.range5) return false;
    const flagpoleMove = (ind.range20.high - ind.range20.low) / ind.range20.low;
    const flagRange = (ind.range5.high - ind.range5.low) / ind.ltp;
    return flagpoleMove > 0.15 && flagRange < 0.05; // a sharp prior move, now consolidating tightly
  },

  "gap-up": (ind) => ind.hasOHLC && ind.todayOpen && ind.prevClose && (ind.todayOpen - ind.prevClose) / ind.prevClose >= 0.02,

  "gap-filling": (ind) =>
    ind.hasOHLC && ind.yesterdayHigh && ind.prevClose &&
    ind.ltp < ind.prevClose && ind.ltp > 0.97 * (ind.range5 ? ind.range5.low : ind.ltp), // retracing back down toward a recent gap zone

  "inside-bar-daily": (ind) =>
    ind.hasOHLC && ind.yesterdayHigh !== undefined && ind.yesterdayLow !== undefined &&
    ind.todayHigh <= ind.yesterdayHigh && ind.todayLow >= ind.yesterdayLow,

  "shakeout-200ema": (ind) => shakeoutPredicate(ind, ind.ema200, ind.ema200Prev),
  "shakeout-50ema": (ind) => shakeoutPredicate(ind, ind.ema50, ind.ema50Prev),
  "shakeout-21ema": (ind) => shakeoutPredicate(ind, ind.ema21, ind.ema21Prev),
  "shakeout-10ema": (ind) => shakeoutPredicate(ind, ind.ema10, ind.ema10Prev),

  "shorting-scanner": (ind) => {
    // A stricter composite short — requires several bearish conditions at
    // once (higher-conviction than any single short scanner alone),
    // mirroring ChartsMaze's single consolidated "Shorting Scanner".
    let score = 0;
    if (ind.sma50 && ind.sma200 && ind.ltp < ind.sma50 && ind.sma50 < ind.sma200) score++;
    if (ind.rsRating !== undefined && ind.rsRating !== null && ind.rsRating <= 25) score++;
    if (ind.rsi && ind.rsi < 45) score++;
    if (ind.ltp < ind.prevClose && ind.volume > 1.2 * ind.avgVolume20) score++;
    return score >= 3;
  },
};

/** Undercuts an EMA intraday then closes back above it, with the EMA itself still rising — a stop-hunt/washout that resolves back in the trend's favor. */
function shakeoutPredicate(ind, emaVal, emaPrev) {
  if (!ind.hasOHLC || !emaVal || !emaPrev) return false;
  return ind.todayLow < emaVal && ind.ltp > emaVal && emaVal >= emaPrev;
}

/* ---------------------------------------------------------------------- */
/* Orchestration                                                           */
/* ---------------------------------------------------------------------- */

/**
 * Runs every scanner in UNIVERSE_SCANNERS against the full synced universe
 * and merges matches into the candidate pool, exactly like a CSV import —
 * each match's scannerSource lists which scanner(s) it satisfied.
 */
async function runUniverseScanners(selectedScannerIds = null) {
  if (!isLiveDataConfigured()) {
    return { ok: false, reason: "not-configured", message: "Live data isn't configured yet. Set your GitHub Pages URL in Settings first." };
  }

  const [history, universe] = await Promise.all([getLivePriceHistory(), getLiveFullUniverse()]);
  if (!history || !universe) {
    return { ok: false, reason: "unreachable", message: "Could not load synced data. Check Settings → Test Connection, and that the sync workflow has run at least once." };
  }

  const universeBySymbol = new Map(universe.stocks.map((s) => [s.symbol, s]));
  const idsToRun = selectedScannerIds && selectedScannerIds.length ? selectedScannerIds : Object.keys(UNIVERSE_SCANNERS);

  const matchesByScanner = {};
  const rawRecordsBySymbol = new Map();

  for (const [symbol, series] of Object.entries(history)) {
    const ind = deriveIndicators(series);
    if (!ind) continue;
    const meta = universeBySymbol.get(symbol) || {};
    ind.rsRating = meta.rsRating;
    const sector = meta.sector;

    for (const scannerId of idsToRun) {
      const predicate = UNIVERSE_SCANNERS[scannerId];
      if (!predicate) continue;
      let passed = false;
      try { passed = !!predicate(ind); } catch (e) { passed = false; }
      if (!passed) continue;

      matchesByScanner[scannerId] = (matchesByScanner[scannerId] || 0) + 1;
      const scannerDef = getScannerById(scannerId);
      const label = scannerDef ? scannerDef.name : scannerId;

      const existing = rawRecordsBySymbol.get(symbol);
      const sources = existing ? new Set([...(existing.scannerSource || "").split(",").map((s) => s.trim()), label]) : new Set([label]);
      rawRecordsBySymbol.set(symbol, {
        symbol, ltp: ind.ltp, changePct: ind.prevClose ? +(((ind.ltp - ind.prevClose) / ind.prevClose) * 100).toFixed(2) : 0,
        volume: ind.volume, avgVolume20: Math.round(ind.avgVolume20), high52w: ind.high52w, low52w: ind.low52w,
        sma50: ind.sma50 ? +ind.sma50.toFixed(2) : undefined, sma200: ind.sma200 ? +ind.sma200.toFixed(2) : undefined,
        rsi: ind.rsi ? +ind.rsi.toFixed(1) : undefined, rsRating: ind.rsRating, sector,
        scannerSource: Array.from(sources).join(", "),
      });
    }
  }

  const records = Array.from(rawRecordsBySymbol.values());
  if (records.length) mergeCandidates(records, "Universe Scan");

  return {
    ok: true,
    totalMatched: records.length,
    byScanner: matchesByScanner,
    universeSize: Object.keys(history).length,
    asOf: universe.asOf,
  };
}

/** List of scanner ids this engine actually implements (a subset of the full library — some, like Failed Breakouts, are watchlist-only by design and intentionally excluded). */
function getRunnableScannerIds() {
  return Object.keys(UNIVERSE_SCANNERS);
}


/* ===== js/modules/journal.js ===== */
/**
 * journal.js
 * Trade journal persistence — every accepted setup, its plan, and its
 * eventual outcome lives here. This is the single source of truth for
 * the Analytics module.
 */


function getJournalEntries() {
  return Store.get(KEYS.JOURNAL, []);
}

function saveEntries(entries) {
  Store.set(KEYS.JOURNAL, entries);
}

/**
 * Add a new journal entry from an accepted trade plan.
 * status: "planned" | "open" | "closed"
 */
function addJournalEntry(entry) {
  const entries = getJournalEntries();
  const record = {
    id: uid("trade"),
    dateAdded: todayISO(),
    status: "planned",
    direction: "long",
    setupType: "",
    symbol: "",
    entry: null,
    stopLoss: null,
    target: null,
    quantity: null,
    exitPrice: null,
    exitDate: null,
    notes: "",
    mistakes: "",
    lessons: "",
    checklistSnapshot: [],
    scoreSnapshot: null,
    ...entry,
  };
  entries.unshift(record);
  saveEntries(entries);
  return record;
}

function updateJournalEntry(id, patch) {
  const entries = getJournalEntries().map((e) => (e.id === id ? { ...e, ...patch } : e));
  saveEntries(entries);
}

function deleteJournalEntry(id) {
  saveEntries(getJournalEntries().filter((e) => e.id !== id));
}

/** Compute realized P&L for a closed entry. Positive = profit. */
function computePnl(entry) {
  if (entry.exitPrice === null || entry.exitPrice === undefined || !entry.entry || !entry.quantity) return null;
  const direction = entry.direction === "short" ? -1 : 1;
  return +((entry.exitPrice - entry.entry) * entry.quantity * direction).toFixed(2);
}

function computePnlPct(entry) {
  if (entry.exitPrice === null || entry.exitPrice === undefined || !entry.entry) return null;
  const direction = entry.direction === "short" ? -1 : 1;
  return +(((entry.exitPrice - entry.entry) / entry.entry) * 100 * direction).toFixed(2);
}


/* ===== js/modules/analytics.js ===== */
/**
 * analytics.js
 * Derives performance statistics purely from closed journal entries.
 * No predictions — strictly retrospective, objective arithmetic.
 */


function getClosedTrades() {
  return getJournalEntries()
    .filter((e) => e.status === "closed" && e.exitPrice !== null && e.exitPrice !== undefined)
    .map((e) => ({ ...e, pnl: computePnl(e), pnlPct: computePnlPct(e) }));
}

function getSummaryStats() {
  const closed = getClosedTrades();
  if (!closed.length) {
    return { totalTrades: 0, winRate: 0, avgWin: 0, avgLoss: 0, expectancy: 0, maxDrawdown: 0, totalPnl: 0 };
  }
  const wins = closed.filter((t) => t.pnl > 0);
  const losses = closed.filter((t) => t.pnl <= 0);
  const avgWin = wins.length ? wins.reduce((s, t) => s + t.pnl, 0) / wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((s, t) => s + t.pnl, 0) / losses.length : 0;
  const winRate = (wins.length / closed.length) * 100;
  const expectancy = (winRate / 100) * avgWin + (1 - winRate / 100) * avgLoss;
  const totalPnl = closed.reduce((s, t) => s + t.pnl, 0);

  // Max drawdown on cumulative equity curve ordered by exit date.
  const ordered = [...closed].sort((a, b) => new Date(a.exitDate || a.dateAdded) - new Date(b.exitDate || b.dateAdded));
  let equity = 0, peak = 0, maxDD = 0;
  for (const t of ordered) {
    equity += t.pnl;
    peak = Math.max(peak, equity);
    maxDD = Math.min(maxDD, equity - peak);
  }

  return {
    totalTrades: closed.length,
    winRate: +winRate.toFixed(1),
    avgWin: +avgWin.toFixed(0),
    avgLoss: +avgLoss.toFixed(0),
    expectancy: +expectancy.toFixed(0),
    maxDrawdown: +maxDD.toFixed(0),
    totalPnl: +totalPnl.toFixed(0),
  };
}

function getMonthlyPerformance() {
  const closed = getClosedTrades();
  const byMonth = {};
  for (const t of closed) {
    const d = t.exitDate || t.dateAdded;
    if (!d) continue;
    const key = d.slice(0, 7); // YYYY-MM
    byMonth[key] = (byMonth[key] || 0) + t.pnl;
  }
  return Object.entries(byMonth).sort(([a], [b]) => a.localeCompare(b)).map(([month, pnl]) => ({ month, pnl: +pnl.toFixed(0) }));
}

function getSetupWiseStats() {
  const closed = getClosedTrades();
  const bySetup = {};
  for (const t of closed) {
    const key = t.setupType || "Unclassified";
    if (!bySetup[key]) bySetup[key] = { setupType: key, trades: 0, wins: 0, totalPnl: 0 };
    bySetup[key].trades += 1;
    if (t.pnl > 0) bySetup[key].wins += 1;
    bySetup[key].totalPnl += t.pnl;
  }
  return Object.values(bySetup)
    .map((s) => ({ ...s, winRate: +((s.wins / s.trades) * 100).toFixed(1), totalPnl: +s.totalPnl.toFixed(0) }))
    .sort((a, b) => b.totalPnl - a.totalPnl);
}

/**
 * chartProvider.js
 * ---------------------------------------------------------------------
 * Wraps TradingView's embeddable widget so the rest of the app never
 * talks to TradingView directly. To swap in another charting provider
 * (Lightweight Charts + your own OHLC feed, a broker's chart widget,
 * etc.) later, only this file needs to change — the Trade Workspace
 * module just calls `ChartProvider.render(...)`.
 *
 * Requires internet access to load the TradingView embed script; when
 * offline, a graceful fallback message is shown instead of a broken
 * iframe.
 * ---------------------------------------------------------------------
 */

const TV_SCRIPT_URL = "https://s3.tradingview.com/tv.js";
let tvScriptPromise = null;

function loadTradingViewScript() {
  if (window.TradingView) return Promise.resolve();
  if (tvScriptPromise) return tvScriptPromise;
  tvScriptPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = TV_SCRIPT_URL;
    script.async = true;
    script.onload = () => resolve();
    script.onerror = () => { tvScriptPromise = null; reject(new Error("Could not load TradingView (offline?)")); };
    document.head.appendChild(script);
    // Fail fast instead of hanging forever with no network — but generous
    // enough for a slow mobile connection, not just broadband.
    setTimeout(() => { tvScriptPromise = null; reject(new Error("TradingView load timed out (offline?)")); }, 15000);
  });
  return tvScriptPromise;
}

/** Map an NSE symbol to a TradingView symbol string. */
function toTradingViewSymbol(symbol, exchange = "NSE") {
  return `${exchange}:${symbol.toUpperCase()}`;
}

/**
 * Render a full advanced chart widget into a container element.
 * @param {HTMLElement} container
 * @param {string} symbol - raw NSE/BSE symbol, e.g. "TATAELXSI"
 * @param {string} interval - TradingView interval code, e.g. "D", "W", "60"
 */
async function renderAdvancedChart(container, symbol, interval = "D") {
  container.innerHTML = `<div class="empty-state"><div class="spinner"></div><p>Loading chart…</p></div>`;
  try {
    await loadTradingViewScript();
  } catch (err) {
    container.innerHTML = "";
    const msg = el("div", { class: "empty-state" }, [
      el("div", { class: "empty-state-icon" }, "⚠"),
      el("p", {}, "Chart didn't load."),
      el("p", { class: "txt-muted", style: "font-size:11px;" }, "Needs an internet connection to TradingView. If you have internet and this persists, an ad-blocker or content blocker may be preventing it."),
    ]);
    const retryBtn = el("button", { class: "btn btn-sm mt-8" }, "Retry");
    retryBtn.addEventListener("click", () => renderAdvancedChart(container, symbol, interval));
    msg.appendChild(retryBtn);
    container.appendChild(msg);
    return;
  }

  if (!document.body.contains(container)) {
    console.warn("renderAdvancedChart: container was not attached to the document — chart cannot render. This is a bug in the calling view, not a network issue.");
    return;
  }

  container.innerHTML = "";
  const widgetDiv = document.createElement("div");
  widgetDiv.id = `tv_chart_${Date.now()}`;
  widgetDiv.style.height = "520px";
  container.appendChild(widgetDiv);

  // eslint-disable-next-line no-new
  new window.TradingView.widget({
    autosize: true,
    symbol: toTradingViewSymbol(symbol),
    interval,
    timezone: "Asia/Kolkata",
    theme: "dark",
    style: "1",
    locale: "in",
    toolbar_bg: "#10141C",
    enable_publishing: false,
    allow_symbol_change: false,
    hide_top_toolbar: false,
    hide_legend: false,
    save_image: false,
    container_id: widgetDiv.id,
  });
}

/* ---------------------------------------------------------------------- */
/* Lightweight "embed widgets" — ticker tape, technical rating, single      */
/* quote. Unlike the advanced chart above, these don't share a global      */
/* TradingView.widget constructor: each is its own self-contained script   */
/* that TradingView's CDN turns into an iframe once inserted into the DOM. */
/* Genuinely live data, free, no API key — this is the real ceiling of     */
/* "live prices" achievable without a paid data vendor or broker API.      */
/* ---------------------------------------------------------------------- */

function mountTradingViewEmbed(container, widgetFile, config, { minHeight = 60 } = {}) {
  if (!document.body.contains(container)) {
    console.warn(`mountTradingViewEmbed(${widgetFile}): container was not attached to the document — widget cannot render. This is a bug in the calling view, not a network issue.`);
    return;
  }
  container.innerHTML = "";
  const wrapper = document.createElement("div");
  wrapper.className = "tradingview-widget-container";
  wrapper.style.minHeight = `${minHeight}px`;
  const inner = document.createElement("div");
  inner.className = "tradingview-widget-container__widget";
  wrapper.appendChild(inner);
  const script = document.createElement("script");
  script.type = "text/javascript";
  script.src = `https://s3.tradingview.com/external-embedding/${widgetFile}`;
  script.async = true;
  script.text = JSON.stringify(config);
  wrapper.appendChild(script);
  container.appendChild(wrapper);

  // These widgets have no onload/onerror hook of their own (the script
  // fetches an iframe internally), so fall back to a message with a retry
  // button if nothing rendered within a generous window — mirrors the
  // advanced chart's fallback for a consistent experience.
  setTimeout(() => {
    if (!wrapper.querySelector("iframe")) {
      container.innerHTML = "";
      const msg = el("div", { class: "txt-muted", style: "font-size:11px; padding:8px 0;" }, "Live data didn't load — needs internet, or an ad-blocker may be interfering.");
      const retryBtn = el("button", { class: "btn btn-sm", style: "margin-left:8px;" }, "Retry");
      retryBtn.addEventListener("click", () => mountTradingViewEmbed(container, widgetFile, config, { minHeight }));
      container.append(msg, retryBtn);
    }
  }, 12000);
}

function wireEvents() {
