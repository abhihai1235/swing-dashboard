  const fileInput = $("#file-input");

  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });
  fileInput.addEventListener("change", (e) => handleFiles(e.target.files));

  ["dragenter", "dragover"].forEach((evt) => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("is-dragover"); }));
  ["dragleave", "drop"].forEach((evt) => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("is-dragover"); }));
  dropzone.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));

  $("#parse-paste-btn").addEventListener("click", () => {
    const text = $("#paste-textarea").value.trim();
    if (!text) { toast("Paste some CSV text first.", "error"); return; }
    const { records } = parseCSV(text);
    if (!records.length) { toast("Couldn't find any rows in that text.", "error"); return; }
    const result = mergeCandidates(records, "Pasted CSV");
    reportMergeResult(result);
  });

  $("#load-sample-btn").addEventListener("click", async () => {
    const sample = await getSampleCandidates();
    const result = mergeCandidates(sample, "Sample Data");
    reportMergeResult(result);
  });

  $("#clear-candidates-btn").addEventListener("click", () => {
    if (confirm("Remove every candidate from the pool? This does not affect your journal.")) {
      clearCandidates();
      refreshSummary();
      refreshSources();
      toast("Candidate pool cleared.", "success");
    }
  });
}

function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  let remaining = files.length;
  let lastResult = null;

  files.forEach((file) => {
    const reader = new FileReader();
    reader.onload = () => {
      const { records } = parseCSV(reader.result);
      if (records.length) lastResult = mergeCandidates(records, file.name.replace(/\.csv$/i, ""));
      remaining -= 1;
      if (remaining === 0 && lastResult) reportMergeResult(lastResult);
    };
    reader.onerror = () => {
      toast(`Couldn't read ${file.name}.`, "error");
      remaining -= 1;
    };
    reader.readAsText(file);
  });
}

function reportMergeResult(result) {
  toast(`Merged. Pool now has ${result.total} candidates${result.incompleteCount ? ` (${result.incompleteCount} missing fields)` : ""}.`, result.incompleteCount ? "error" : "success");
  refreshSummary();
  refreshSources();
}

function refreshSources() {
  const body = $("#import-sources-body");
  if (!body) return;
  const batches = getImportBatches();
  body.innerHTML = "";
  if (!batches.length) {
    body.appendChild(el("p", { class: "txt-muted" }, "No sources imported yet."));
    return;
  }
  batches
    .slice()
    .reverse()
    .forEach((batch) => {
      const row = el("div", { class: "plan-row" }, [
        el("span", { class: "label" }, [
          el("strong", { style: "color:var(--text-primary);" }, batch.label),
          el("span", { class: "txt-muted", style: "font-size:11px;" }, ` — ${batch.symbolCount} symbol(s) · ${new Date(batch.timestamp).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" })}`),
        ]),
        el("button", {
          class: "btn btn-sm btn-danger",
          onclick: () => {
            if (confirm(`Remove "${batch.label}" from the candidate pool? Stocks only flagged by this source will be removed; stocks other scanners also flagged will stay, minus this source's contribution.`)) {
              removeImportBatch(batch.id);
              refreshSummary();
              refreshSources();
              toast(`Removed source "${batch.label}".`, "success");
            }
          },
        }, "Remove source"),
      ]);
      body.appendChild(row);
    });
}

function refreshSummary() {
  const body = $("#import-summary-body");
  if (!body) return;
  const candidates = getCandidates();
  if (!candidates.length) {
    body.innerHTML = "";
    body.appendChild(el("div", { class: "empty-state" }, [
      el("div", { class: "empty-state-icon" }, "◇"),
      el("p", {}, "No candidates imported yet."),
      el("p", { class: "txt-muted" }, "Run a scanner from the Scanner Library, export the CSV, then drop it above."),
    ]));
    return;
  }
  const sources = new Set();
  candidates.forEach((c) => (c.scannerSource || "").split(",").forEach((s) => s.trim() && sources.add(s.trim())));
  body.innerHTML = "";
  body.appendChild(el("div", { class: "import-summary" }, [
    el("div", { class: "import-stat" }, [el("b", {}, String(candidates.length)), "Total candidates"]),
    el("div", { class: "import-stat" }, [el("b", {}, String(sources.size)), "Scanner sources merged"]),
    el("div", { class: "import-stat" }, [el("b", {}, new Set(candidates.map((c) => c.sector).filter(Boolean)).size.toString()), "Sectors represented"]),
  ]));
}

/**
 * candidatesView.js
 * Curated Top 10 Long / Top 10 Short lists (auto-backfilling as candidates
 * are excluded or removed) plus a full sortable list for auditing,
 * restoring excluded candidates, or managing every import at once.
 */

let currentSort = { key: "composite", dir: "desc" };
let activeTab = "top-long";
let showRejectedInFullList = false;
let refreshAllPanels = () => {};

function renderCandidates(container, onOpenCandidate) {
  container.innerHTML = "";
  container.appendChild(
    el("div", { class: "view-header" }, [
      el("div", {}, [
        el("h2", { class: "view-title" }, "Ranked Candidates"),
        el("div", { class: "view-subtitle" }, "Top 10 Long and Top 10 Short are curated automatically from your techno-funda score — exclude one and the next-best candidate takes its place."),
      ]),
    ])
  );

  const tabs = el("div", { class: "tabs" }, [
    tabButton("top-long", "Top 10 Long"),
    tabButton("top-short", "Top 10 Short"),
    tabButton("full", "Full List"),
  ]);
  container.appendChild(tabs);

  const panelLong = el("div", { class: `tab-panel${activeTab === "top-long" ? " is-active" : ""}`, id: "panel-top-long" });
  const panelShort = el("div", { class: `tab-panel${activeTab === "top-short" ? " is-active" : ""}`, id: "panel-top-short" });
  const panelFull = el("div", { class: `tab-panel${activeTab === "full" ? " is-active" : ""}`, id: "panel-full" });
  container.append(panelLong, panelShort, panelFull);

  function switchTab(tab) {
    activeTab = tab;
    $$(".tab-btn").forEach((b) => b.classList.toggle("is-active", b.dataset.tab === tab));
    $$(".tab-panel").forEach((p) => p.classList.remove("is-active"));
    ({ "top-long": panelLong, "top-short": panelShort, full: panelFull })[tab].classList.add("is-active");
  }
  $$(".tab-btn", tabs).forEach((btn) => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));

  // Any mutation (exclude / restore / remove) should refresh ALL THREE panels —
  // not just the one the user clicked in — since excluding a stock in Full List
  // affects the Top 10 tabs and vice versa.
  refreshAllPanels = () => {
    drawTopTen(panelLong, "long", onOpenCandidate);
    drawTopTen(panelShort, "short", onOpenCandidate);
    drawFullList(panelFull, onOpenCandidate);
  };

  refreshAllPanels();
}

function tabButton(tab, label) {
  return el("button", { class: `tab-btn${activeTab === tab ? " is-active" : ""}`, "data-tab": tab }, label);
}

/* ---------------------------------------------------------------------- */
/* Top 10 (curated, auto-backfilling)                                      */
/* ---------------------------------------------------------------------- */

function drawTopTen(panel, bias, onOpenCandidate) {
  const top = getTopCandidates(bias, 10);
  panel.innerHTML = "";

  if (!top.length) {
    panel.appendChild(el("div", { class: "empty-state" }, [
      el("div", { class: "empty-state-icon" }, "◇"),
      el("p", {}, `No ${bias} candidates yet.`),
      el("p", { class: "txt-muted" }, "Import scanner results in Scanner Import, or load the sample data to try this out."),
    ]));
    return;
  }

  const table = el("table");
  table.appendChild(el("thead", {}, el("tr", {}, ["Rank", "Score", "Symbol", "Sector", "LTP", "Chg %", "Source", ""].map((h) => el("th", {}, h)))));
  const tbody = el("tbody");
  top.forEach((c, idx) => {
    const { label, cssVar } = scoreLabel(c.composite);
    const lowData = (c.completeness ?? 1) < 0.6;
    tbody.appendChild(
      el("tr", { class: "candidate-row", onclick: () => onOpenCandidate(c.id) }, [
        el("td", { class: "mono txt-muted" }, `#${idx + 1}`),
        el("td", {}, [
          el("div", { class: "score-dial", style: `--pct:${c.composite}; --dial-color:var(${cssVar});` }, [
            el("div", { class: "score-dial-inner" }, String(c.composite)),
          ]),
        ]),
        el("td", {}, [
          el("strong", {}, c.symbol),
          el("div", { class: "txt-muted", style: "font-size:10px;" }, label),
          lowData ? el("div", { class: "txt-muted", style: "font-size:9px;", "data-tip": "Scanner export was missing SMA/RSI/52-week fields — some categories used a neutral fallback." }, "◐ limited data") : null,
        ]),
        el("td", {}, c.sector || "—"),
        el("td", {}, fmtINR(c.ltp)),
        el("td", { class: c.changePct >= 0 ? "txt-teal" : "txt-red" }, fmtPct(c.changePct)),
        el("td", { class: "txt-muted", style: "font-family:var(--font-body); font-size:11px; white-space:normal;" }, c.scannerSource || "—"),
        el("td", {}, [
          el("button", {
            class: "btn btn-sm",
            "data-tip": "Exclude — drops out of ranking, next-best candidate takes this slot. Restore later from the Full List tab.",
            onclick: (e) => { e.stopPropagation(); rejectCandidate(c.id); refreshAllPanels(); toast(`${c.symbol} excluded — next-best candidate promoted.`, "info"); },
          }, "Exclude"),
        ]),
      ])
    );
  });
  table.appendChild(tbody);
  panel.appendChild(el("div", { class: "table-wrap" }, [table]));
}

/* ---------------------------------------------------------------------- */
/* Full list (sortable, can include excluded candidates for review/restore) */
/* ---------------------------------------------------------------------- */

function drawFullList(panel, onOpenCandidate) {
  panel.innerHTML = "";

  const toolbar = el("div", { class: "flex gap-8 items-center mt-8", style: "margin-bottom:12px;" }, [
    el("label", { class: "flex items-center gap-8", style: "margin:0;" }, [
      (() => {
        const cb = el("input", { type: "checkbox" });
        cb.checked = showRejectedInFullList;
        cb.addEventListener("change", (e) => { showRejectedInFullList = e.target.checked; drawFullList(panel, onOpenCandidate); });
        return cb;
      })(),
      "Show excluded candidates too",
    ]),
  ]);
  panel.appendChild(toolbar);

  const tableWrap = el("div", { class: "table-wrap" });
  panel.appendChild(tableWrap);
  drawFullTable(tableWrap, onOpenCandidate);
}

function drawFullTable(tableWrap, onOpenCandidate) {
  let ranked = getRankedCandidates(undefined, { includeRejected: showRejectedInFullList });
  if (!ranked.length) {
    tableWrap.innerHTML = "";
    tableWrap.appendChild(el("div", { class: "empty-state" }, [
      el("div", { class: "empty-state-icon" }, "◇"),
      el("p", {}, "No candidates to rank yet."),
      el("p", { class: "txt-muted" }, "Head to Scanner Import to load a CSV, or Load Sample Data to explore the app."),
    ]));
    return;
  }

  ranked.sort((a, b) => {
    const av = a[currentSort.key], bv = b[currentSort.key];
    const cmp = typeof av === "string" ? av.localeCompare(bv) : (av ?? 0) - (bv ?? 0);
    return currentSort.dir === "asc" ? cmp : -cmp;
  });

  const columns = [
    { key: "composite", label: "Score" },
    { key: "symbol", label: "Symbol" },
    { key: "sector", label: "Sector" },
    { key: "ltp", label: "LTP" },
    { key: "changePct", label: "Chg %" },
    { key: "bias", label: "Bias" },
    { key: "scannerSource", label: "Source" },
    { key: null, label: "" },
  ];

  const table = el("table");
  const thead = el("thead", {}, el("tr", {}, columns.map((c) =>
    c.key
      ? el("th", { onclick: () => { toggleSort(c.key); drawFullTable(tableWrap, onOpenCandidate); } },
          c.label + (currentSort.key === c.key ? (currentSort.dir === "asc" ? " ▲" : " ▼") : "")
        )
      : el("th", {}, "")
  )));
  table.appendChild(thead);

  const tbody = el("tbody");
  ranked.forEach((c) => {
    const { label, cssVar } = scoreLabel(c.composite);
    const lowData = (c.completeness ?? 1) < 0.6;
    const row = el("tr", { class: `candidate-row${c.rejected ? " txt-muted" : ""}`, style: c.rejected ? "opacity:0.55;" : "", onclick: () => onOpenCandidate(c.id) }, [
      el("td", {}, [
        el("div", { class: "score-dial", style: `--pct:${c.composite}; --dial-color:var(${cssVar});` }, [
          el("div", { class: "score-dial-inner" }, String(c.composite)),
        ]),
      ]),
      el("td", {}, [
        el("strong", {}, c.symbol),
        el("div", { class: "txt-muted", style: "font-size:10px;" }, c.rejected ? "Excluded" : label),
        lowData ? el("div", { class: "txt-muted", style: "font-size:9px;" }, "◐ limited data") : null,
      ]),
      el("td", {}, c.sector || "—"),
      el("td", {}, fmtINR(c.ltp)),
      el("td", { class: c.changePct >= 0 ? "txt-teal" : "txt-red" }, fmtPct(c.changePct)),
      el("td", {}, el("span", { class: `badge badge-${c.bias === "long" ? "long" : "short"}` }, c.bias === "long" ? "Long" : "Short")),
      el("td", { class: "txt-muted", style: "font-family:var(--font-body); font-size:11px; white-space:normal;" }, c.scannerSource || "—"),
      el("td", {}, [
        c.rejected
          ? el("button", {
              class: "btn btn-sm",
              onclick: (e) => { e.stopPropagation(); restoreCandidate(c.id); refreshAllPanels(); toast(`${c.symbol} restored to ranking.`, "success"); },
            }, "Restore")
          : el("button", {
              class: "btn btn-sm btn-danger",
              "data-tip": "Permanently remove just this candidate",
              onclick: (e) => {
                e.stopPropagation();
                if (confirm(`Remove ${c.symbol} from the candidate pool?`)) {
                  removeCandidate(c.id);
                  refreshAllPanels();
                }
              },
            }, "✕"),
      ]),
    ]);
    tbody.appendChild(row);
  });
  table.appendChild(tbody);

  tableWrap.innerHTML = "";
  tableWrap.appendChild(table);
}

function toggleSort(key) {
  if (currentSort.key === key) currentSort.dir = currentSort.dir === "asc" ? "desc" : "asc";
  else currentSort = { key, dir: "desc" };
}

let planState = {};
let checkedItems = new Set();

function renderTradeWorkspace(container, candidateId, onCandidateAccepted) {

  if (!candidate) {

  }

    entry: candidate.ltp || 0,
    stopLoss: candidate.sma50 ? +(candidate.sma50 * 0.99).toFixed(2) : +(candidate.ltp * 0.95).toFixed(2),
    target: candidate.high52w ? +(candidate.high52w * 1.08).toFixed(2) : +(candidate.ltp * 1.15).toFixed(2),
    thesis: candidate.notes || "",
    srNotes: candidate.srNotes || "",
    direction: candidate.bias || "long",
    setupType: (candidate.scannerSource || "").split(",")[0]?.trim() || "",
  };
  checkedItems = new Set(candidate.checklistChecked || []);

  const { label, cssVar } = scoreLabel(candidate.composite ?? 0);

  container.appendChild(
    el("div", { class: "view-header" }, [
      el("div", {}, [
        el("h2", { class: "view-title" }, `${candidate.symbol} — ${candidate.companyName || ""}`),

  );

  const layout = el("div", { class: "workspace-layout" });

  const left = el("div", {});

  const tfRow = el("div", { class: "tv-timeframes" });
  const chartWrap = el("div", { class: "tv-chart-wrap" });
  TIMEFRAMES.forEach((tf, idx) => {
    const btn = el("button", { class: `btn btn-sm${idx === 2 ? " btn-primary" : ""}` }, tf.label);

    el("div", { id: "tv-technical-gauge" }),
  ]);
  left.appendChild(liveRatingPanel);

  const thesisPanel = el("div", { class: "panel mt-16" }, [
    el("div", { class: "panel-title" }, "Trade Thesis & Support/Resistance Notes"),
    el("div", { class: "field" }, [
      el("label", {}, "Setup type"),
      textInput(planState.setupType, (v) => (planState.setupType = v)),
    ]),
    el("div", { class: "field" }, [
      el("label", {}, "Why this trade? (thesis)"),
      textArea(planState.thesis, (v) => (planState.thesis = v)),
    ]),
    el("div", { class: "field" }, [
      el("label", {}, "Key support / resistance levels"),
      textArea(planState.srNotes, (v) => (planState.srNotes = v)),
    ]),
  ]);
  left.appendChild(thesisPanel);

  /* -------------------- Right column: plan, risk, checklist -------------------- */
  const right = el("div", {});

  const planPanel = el("div", { class: "panel" });
  planPanel.appendChild(el("div", { class: "panel-title" }, "Trade Plan"));
  const directionSelect = el("select", {}, [
    el("option", { value: "long", selected: planState.direction === "long" ? "true" : null }, "Long"),
    el("option", { value: "short", selected: planState.direction === "short" ? "true" : null }, "Short"),
  ]);
  directionSelect.addEventListener("change", (e) => { planState.direction = e.target.value; redrawPlan(); });
  planPanel.appendChild(el("div", { class: "field" }, [el("label", {}, "Direction"), directionSelect]));

  const entryInput = numberInput(planState.entry, (v) => { planState.entry = v; redrawPlan(); });
  const stopInput = numberInput(planState.stopLoss, (v) => { planState.stopLoss = v; redrawPlan(); });
  const targetInput = numberInput(planState.target, (v) => { planState.target = v; redrawPlan(); });
  planPanel.append(
    el("div", { class: "field" }, [el("label", {}, "Entry zone"), entryInput]),
    el("div", { class: "field" }, [el("label", {}, "Stop-loss"), stopInput]),
    el("div", { class: "field" }, [el("label", {}, "Target"), targetInput]),
  );
  const planStatsBox = el("div", {});
  planPanel.appendChild(planStatsBox);
  right.appendChild(planPanel);

  const checklistPanel = el("div", { class: "panel mt-16" });
  checklistPanel.appendChild(el("div", { class: "panel-title" }, "Trade Checklist"));
  const checklistBox = el("div", {});
  checklistPanel.appendChild(checklistBox);
  right.appendChild(checklistPanel);

  const notesPanel = el("div", { class: "panel mt-16" }, [
    el("div", { class: "panel-title" }, "Personal Notes"),
    textArea(candidate.personalNotes || "", (v) => updateCandidate(candidate.id, { personalNotes: v })),
  ]);
  right.appendChild(notesPanel);

  const actionsPanel = el("div", { class: "panel mt-16 flex gap-8" });
  const acceptBtn = el("button", { class: "btn btn-primary w-full" }, "Accept — Send to Journal");
  const rejectBtn = el("button", { class: "btn btn-danger" }, "Reject");
  actionsPanel.append(acceptBtn, rejectBtn);
  right.appendChild(actionsPanel);

  layout.append(left, right);
  container.appendChild(layout);

  // IMPORTANT: these must run AFTER the containers above are attached to
  // the live document — TradingView's widgets locate their container via
  // document.getElementById()/DOM traversal, which silently fails on
  // detached nodes. Render on a still-detached tree = nothing ever shows.
  renderAdvancedChart(chartWrap, candidate.symbol, "D");
  renderTechnicalAnalysisGauge($("#tv-technical-gauge", liveRatingPanel), candidate.symbol, "1D");

  function redrawPlan() {
    const risk = getRiskSettings();
    const sizing = computePositionSize(risk.capital, risk.maxRiskPerTradePct, planState.entry, planState.stopLoss);
    const rr = computeRewardRisk(planState.entry, planState.stopLoss, planState.target);
    planStatsBox.innerHTML = "";
    planStatsBox.append(
      planRow("Position size", `${sizing.quantity} shares`),
      planRow("Capital required", fmtINR(sizing.capitalRequired, 0)),
      planRow("Risk amount", fmtINR(sizing.riskAmount, 0)),
      planRow("% of capital deployed", sizing.portfolioPct.toFixed(1) + "%"),
      planRow("Reward : Risk", `${rr} : 1`, rr >= 2 ? "txt-teal" : "txt-red"),
    );
  }

  function redrawChecklist() {
    checklistBox.innerHTML = "";
    const evalResult = evaluateChecklist(Array.from(checkedItems));
    if (evalResult.hasCriticalFailure) {
      checklistBox.appendChild(el("div", { class: "badge badge-short mt-8" }, `${evalResult.failedCritical.length} critical item(s) unchecked`));
    }
    evalResult.results.forEach((item) => {
      const cb = el("input", { type: "checkbox" });
      cb.checked = item.passed;
      cb.addEventListener("change", () => {
        if (cb.checked) checkedItems.add(item.id); else checkedItems.delete(item.id);
        redrawChecklist();
      });
      const row = el("label", { class: `checklist-item${item.critical ? " critical" : ""}${item.critical && !item.passed ? " failed" : ""}` }, [
        cb,
        el("span", { class: "checklist-label" }, item.label),
      ]);
      checklistBox.appendChild(row);
    });
    checklistBox.appendChild(el("p", { class: "txt-muted mt-8" }, `${evalResult.totalPassed}/${evalResult.totalItems} confirmed.`));
  }

  redrawPlan();
  redrawChecklist();

  acceptBtn.addEventListener("click", () => {
    const evalResult = evaluateChecklist(Array.from(checkedItems));
    if (evalResult.hasCriticalFailure) {
      const proceed = confirm(`${evalResult.failedCritical.length} critical checklist item(s) are unchecked:\n\n${evalResult.failedCritical.map((f) => "• " + f.label).join("\n")}\n\nSend to journal anyway?`);
      if (!proceed) return;
    }
    const risk = getRiskSettings();
    const sizing = computePositionSize(risk.capital, risk.maxRiskPerTradePct, planState.entry, planState.stopLoss);
    addJournalEntry({
      symbol: candidate.symbol,
      direction: planState.direction,
      setupType: planState.setupType,
      entry: planState.entry,
      stopLoss: planState.stopLoss,
      target: planState.target,
      quantity: sizing.quantity,
      notes: planState.thesis,
      checklistSnapshot: evalResult.results,
      scoreSnapshot: candidate.composite,
      status: "planned",
    });
    updateCandidate(candidate.id, { checklistChecked: Array.from(checkedItems) });
    toast(`${candidate.symbol} sent to journal.`, "success");
    if (onCandidateAccepted) onCandidateAccepted(candidate.id);
  });

  rejectBtn.addEventListener("click", () => {
    rejectCandidate(candidate.id);
    toast(`${candidate.symbol} excluded from ranking — kept for reference, and the next-best candidate now fills its Top 10 slot.`, "info");
  });
}

function drawJournalList(list) {
  const entries = getJournalEntries();
  list.innerHTML = "";
  if (!entries.length) {
    list.appendChild(el("div", { class: "empty-state" }, [
      el("div", { class: "empty-state-icon" }, "◇"),
      el("p", {}, "Your journal is empty."),
      el("p", { class: "txt-muted" }, "Accept a setup from the Trade Workspace to start building your track record."),
    ]));
    return;
  }

  entries.forEach((entry) => {
    const pnl = computePnl(entry);
    const pnlPct = computePnlPct(entry);
    const card = el("div", { class: "journal-entry" });

    card.appendChild(el("div", { class: "journal-entry-header" }, [
      el("div", {}, [
        el("strong", {}, entry.symbol), " ",
        el("span", { class: `badge badge-${entry.direction === "long" ? "long" : "short"}` }, entry.direction),
        " ", el("span", { class: "txt-muted" }, entry.setupType || "Unclassified"),
      ]),
      el("div", { class: "flex gap-8 items-center" }, [
        pnl !== null ? el("span", { class: `journal-pnl ${pnl >= 0 ? "pos" : "neg"} mono` }, `${fmtINR(pnl, 0)} (${pnlPct}%)`) : null,
        statusSelect(entry, list),
        el("button", { class: "btn btn-sm btn-danger", onclick: () => { if (confirm("Delete this journal entry?")) { deleteJournalEntry(entry.id); drawJournalList(list); } } }, "Delete"),
      ]),
    ]));

    const grid = el("div", { class: "grid grid-4 mt-8" }, [
      readonlyField("Entry", fmtINR(entry.entry)),
      readonlyField("Stop-loss", fmtINR(entry.stopLoss)),
      readonlyField("Target", fmtINR(entry.target)),
      readonlyField("Quantity", entry.quantity ?? "—"),
    ]);
    card.appendChild(grid);

    if (entry.status !== "planned") {
      const exitGrid = el("div", { class: "grid grid-2 mt-8" }, [
        fieldEditor("Exit price", entry.exitPrice ?? "", "number", (v) => { updateJournalEntry(entry.id, { exitPrice: v === "" ? null : parseFloat(v) }); drawJournalList(list); }),
        fieldEditor("Exit date", entry.exitDate || todayISO(), "date", (v) => { updateJournalEntry(entry.id, { exitDate: v }); drawJournalList(list); }),

    el("option", { value: "planned", selected: entry.status === "planned" ? "true" : null }, "Planned"),
    el("option", { value: "open", selected: entry.status === "open" ? "true" : null }, "Open"),

function fieldEditor(label, value, type, onChange) {

}

  const legend = el("div", { class: "flex gap-8", style: "flex-wrap:wrap; margin-top:10px;" });

  drawRrgQuadrantChart(canvas, data.sectors);

function drawRrgQuadrantChart(canvas, sectorsData) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const allPoints = Object.values(sectorsData).flat();
  const ratios = allPoints.map((p) => p.rsRatio);
  const moms = allPoints.map((p) => p.rsMomentum);
  const pad = 2;
  const minR = Math.min(...ratios, 100) - pad, maxR = Math.max(...ratios, 100) + pad;
  const minM = Math.min(...moms, 100) - pad, maxM = Math.max(...moms, 100) + pad;

  const xOf = (r) => ((r - minR) / (maxR - minR)) * (W - 60) + 40;
  const yOf = (m) => H - (((m - minM) / (maxM - minM)) * (H - 60) + 30);

  // Quadrant backgrounds
  const midX = xOf(100), midY = yOf(100);
  ctx.fillStyle = "rgba(47,191,159,0.08)"; ctx.fillRect(midX, 30, W - 40 - midX, midY - 30);       // leading (top-right)
  ctx.fillStyle = "rgba(201,162,75,0.08)"; ctx.fillRect(midX, midY, W - 40 - midX, H - 30 - midY);  // weakening (bottom-right)
  ctx.fillStyle = "rgba(229,83,75,0.08)"; ctx.fillRect(40, midY, midX - 40, H - 30 - midY);          // lagging (bottom-left)
  ctx.fillStyle = "rgba(76,141,255,0.08)"; ctx.fillRect(40, 30, midX - 40, midY - 30);                // improving (top-left)

  ctx.strokeStyle = "#303A4D"; ctx.beginPath(); ctx.moveTo(40, midY); ctx.lineTo(W - 40, midY); ctx.moveTo(midX, 30); ctx.lineTo(midX, H - 30); ctx.stroke();

  ctx.fillStyle = "#6C7690"; ctx.font = "11px sans-serif";
  ctx.fillText("Improving", 46, 44); ctx.fillText("Leading", W - 100, 44);
  ctx.fillText("Lagging", 46, H - 38); ctx.fillText("Weakening", W - 110, H - 38);

  const colors = ["#2FBF9F", "#E5534B", "#C9A24B", "#4C8DFF", "#9B7EDE", "#7FBF4B", "#C97A3A", "#E5534B", "#4C8DFF", "#2FBF9F", "#C9A24B", "#9B7EDE"];
  Object.entries(sectorsData).forEach(([name, tail], i) => {
    const color = colors[i % colors.length];
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
    tail.forEach((p, idx) => { const x = xOf(p.rsRatio), y = yOf(p.rsMomentum); if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.stroke();
    const last = tail[tail.length - 1];
    const x = xOf(last.rsRatio), y = yOf(last.rsMomentum);
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#E7EBF3"; ctx.font = "10px sans-serif"; ctx.fillText(name, x + 7, y - 7);
  });
}

    return;
  }

  const company = fundamentals[symbol];

  // Live technical gauge always works for any valid NSE symbol, fundamentals or not.
  // resultsBox is already attached to the live document (drawProfileTab appended it
  // to panel, which is part of the persistent Market Intel tab structure) — safe to
  // render into immediately, same requirement as the Trade Workspace chart fix.
  const gaugePanel = el("div", { class: "panel" }, [
    el("div", { class: "panel-title" }, [`${symbol} — Live Technical Rating`, el("span", { class: "txt-muted", style: "text-transform:none; letter-spacing:0;" }, "TradingView")]),
    el("div", { id: `profile-gauge-${symbol}` }),
  ]);
  resultsBox.appendChild(gaugePanel);
  renderTechnicalAnalysisGauge($(`#profile-gauge-${symbol}`, gaugePanel), symbol, "1D");

  const fundPanel = el("div", { class: "panel mt-16" }, [el("div", { class: "panel-title" }, ["Quarterly Results", company ? el("span", { class: "txt-muted", style: "text-transform:none; letter-spacing:0;" }, `as of ${company.lastSyncedDate}`) : null])]);
  if (!company || !company.quarters || !company.quarters.length) {
    fundPanel.appendChild(el("p", { class: "txt-muted" }, "No synced results for this symbol yet — fundamentals are only pulled in on the day a company actually files results, so this fills in over time as filings happen. (Symbol not found, or hasn't reported since sync started.)"));
  } else {
    const table = el("table");
    table.appendChild(el("thead", {}, el("tr", {}, ["Period", "Sales (₹ Cr)", "EBITDA (₹ Cr)", "OPM %", "Net Profit (₹ Cr)", "NPM %", "EPS", "Sales QoQ", "NP QoQ"].map((h) => el("th", {}, h)))));
    const tbody = el("tbody");
    company.quarters.forEach((q) => {
      const toCr = (lakhs) => (lakhs === null || lakhs === undefined ? "—" : fmtINR(lakhs / 100, 1));
      tbody.appendChild(el("tr", {}, [
        el("td", {}, `${q.periodFrom || "—"} to ${q.periodTo || "—"}`),
        el("td", {}, toCr(q.salesLakhs)),
        el("td", {}, toCr(q.ebitdaLakhs)),
        el("td", {}, q.opmPct !== null && q.opmPct !== undefined ? q.opmPct + "%" : "—"),
        el("td", {}, toCr(q.netProfitLakhs)),
        el("td", {}, q.npmPct !== null && q.npmPct !== undefined ? q.npmPct + "%" : "—"),
        el("td", {}, String(q.eps ?? "—")),
        el("td", { class: q.salesQoQPct > 0 ? "txt-teal" : q.salesQoQPct < 0 ? "txt-red" : "" }, q.salesQoQPct !== undefined ? fmtPct(q.salesQoQPct) : "—"),
        el("td", { class: q.netProfitQoQPct > 0 ? "txt-teal" : q.netProfitQoQPct < 0 ? "txt-red" : "" }, q.netProfitQoQPct !== undefined ? fmtPct(q.netProfitQoQPct) : "—"),
      ]));
    });
    table.appendChild(tbody);
    fundPanel.appendChild(el("div", { class: "table-wrap" }, [table]));
  }
  resultsBox.appendChild(fundPanel);

  const symbolAnnouncements = (announcementsData?.items || []).filter((a) => (a.symbol || "").toUpperCase() === symbol);
  const annPanel = el("div", { class: "panel mt-16" }, [el("div", { class: "panel-title" }, "Recent Announcements")]);
  if (!symbolAnnouncements.length) {
    annPanel.appendChild(el("p", { class: "txt-muted" }, "None today for this symbol."));
  } else {
    symbolAnnouncements.forEach((a) => {
      annPanel.appendChild(el("p", { style: "font-size:12px;" }, a.desc || a.subject || JSON.stringify(a).slice(0, 100)));
    });
  }
  resultsBox.appendChild(annPanel);
}

async function drawDealsTab(panel) {
  panel.innerHTML = `<div class="loading-state"><div class="spinner"></div></div>`;
  const data = await getLiveBulkBlockDeals();
  if (!data) return emptyPanelState(panel, "Not synced yet — the workflow needs to run at least once.");

  panel.innerHTML = "";
  panel.appendChild(el("p", { class: "txt-muted", style: "font-size:11px;" }, `As of ${data.asOf}`));
  ["bulk_deals", "block_deals", "short_selling"].forEach((key) => {
    const rows = data[key] || [];
    const title = { bulk_deals: "Bulk Deals", block_deals: "Block Deals", short_selling: "Short Selling" }[key];
    const box = el("div", { class: "panel mt-16" }, [el("div", { class: "panel-title" }, [title, el("span", { class: "txt-muted", style: "text-transform:none; letter-spacing:0;" }, `${rows.length} record(s)`)])]);
    if (!rows.length) {
      box.appendChild(el("p", { class: "txt-muted" }, "None reported."));
    } else {
      const table = el("table");
      const cols = Object.keys(rows[0]).slice(0, 6);
      table.appendChild(el("thead", {}, el("tr", {}, cols.map((c) => el("th", {}, c)))));
      const tbody = el("tbody");
      rows.slice(0, 20).forEach((r) => tbody.appendChild(el("tr", {}, cols.map((c) => el("td", {}, String(r[c] ?? "—"))))));
      table.appendChild(tbody);
      box.appendChild(el("div", { class: "table-wrap" }, [table]));
    }
    panel.appendChild(box);
  });
}

/* ===== js/views/settingsView.js ===== */

const WEIGHT_LABELS = {
  trend: "Trend (Stage Analysis)",
  relativeStrength: "Relative Strength",
  volume: "Volume (Accumulation/Distribution)",
  liquidity: "Liquidity",
  proximityToExtreme: "Proximity to High/Low",
  momentum: "Momentum (RSI)",
  baseQuality: "Base Quality (VCP)",
  breakoutQuality: "Breakout/Breakdown Quality",
  riskReward: "Risk/Reward",
  fundamentals: "Fundamentals (EPS/Sales/ROE)",
  marketContext: "Market Context",
};

function renderSettings(container) {
  container.innerHTML = "";
  container.appendChild(
    el("div", { class: "view-header" }, [
      el("div", {}, [el("h2", { class: "view-title" }, "Settings"), el("div", { class: "view-subtitle" }, "Live data sync, risk manager defaults, and scoring weights — tune these to match your own trading rules.")]),
    ])
  );

  /* ---- Live data sync ---- */
  const liveDataPanel = el("div", { class: "panel" });
  liveDataPanel.appendChild(el("div", { class: "panel-title" }, ["Live Market Data Sync", liveBadge(isLiveDataConfigured())]));
  liveDataPanel.appendChild(el("p", { class: "txt-muted" }, "Point this at your deployed GitHub Pages URL to replace demo data with real, daily-synced NSE data across the whole app — Market Breadth, Sector Analytics, Top Gainers, Past Winners, RRG, Bulk/Block Deals, Circuit List, Results Calendar, and the Universe Scanner. See docs/LIVE_DATA_SETUP.md for the one-time setup."));
  const urlInput = el("input", { type: "text", placeholder: "https://yourusername.github.io/your-repo-name", value: getLiveDataBaseUrl() });
  const statusLine = el("p", { class: "txt-muted mt-8", style: "font-size:12px;" }, "");
  liveDataPanel.append(
    el("div", { class: "field" }, [el("label", {}, "GitHub Pages URL"), urlInput]),
    el("div", { class: "flex gap-8" }, [
      el("button", { class: "btn btn-primary", onclick: () => { saveLiveDataBaseUrl(urlInput.value); toast("Live data URL saved.", "success"); renderSettings(container); } }, "Save"),
      el("button", { class: "btn", onclick: async () => {
        statusLine.textContent = "Testing…";
        const result = await testLiveDataConnection();
        statusLine.textContent = result.message;
        statusLine.className = `mt-8 ${result.ok ? "txt-teal" : "txt-red"}`;
        toast(result.message, result.ok ? "success" : "error");
      } }, "Test Connection"),
    ]),
    statusLine,
  );
  container.appendChild(liveDataPanel);

  /* ---- Risk manager ---- */
  const risk = getRiskSettings();
  const riskPanel = el("div", { class: "panel mt-16" });
  riskPanel.appendChild(el("div", { class: "panel-title" }, "Risk Manager Defaults"));
  const capitalInput = el("input", { type: "number", value: risk.capital });
  const maxRiskInput = el("input", { type: "number", step: "0.1", value: risk.maxRiskPerTradePct });
  const maxExposureInput = el("input", { type: "number", step: "1", value: risk.maxPortfolioExposurePct });
  riskPanel.append(
    el("div", { class: "grid grid-3" }, [
      el("div", { class: "field" }, [el("label", {}, "Total trading capital (₹)"), capitalInput]),
      el("div", { class: "field" }, [el("label", {}, "Max risk per trade (%)"), maxRiskInput]),
      el("div", { class: "field" }, [el("label", {}, "Max portfolio exposure (%)"), maxExposureInput]),
    ]),
    el("div", { class: "flex gap-8 mt-8" }, [
      el("button", { class: "btn btn-primary", onclick: () => {
        saveRiskSettings({ capital: parseFloat(capitalInput.value) || 0, maxRiskPerTradePct: parseFloat(maxRiskInput.value) || 0, maxPortfolioExposurePct: parseFloat(maxExposureInput.value) || 0 });
        toast("Risk settings saved.", "success");
      } }, "Save Risk Settings"),
      el("button", { class: "btn", onclick: () => {
        saveRiskSettings({ ...DEFAULT_RISK_SETTINGS });
        toast("Reset to defaults — reload Settings to see them.", "info");
        renderSettings(container);
      } }, "Reset to Defaults"),
    ])
  );
  container.appendChild(riskPanel);

  /* ---- Scoring weights ---- */
  const weights = getWeights();
  const weightPanel = el("div", { class: "panel mt-16" });
  weightPanel.appendChild(el("div", { class: "panel-title" }, ["Scoring Weights", el("span", { class: "txt-muted", style: "text-transform:none; letter-spacing:0;" }, `Sum: ${weightSum(weights)}`)]));
  const workingWeights = { ...weights };
  const sumLabel = el("span", {}, "");
  Object.keys(DEFAULT_WEIGHTS).forEach((key) => {
    const row = el("div", { class: "weight-row" });
    const valueLabel = el("span", { class: "mono" }, String(workingWeights[key] ?? 0));
    const slider = el("input", { type: "range", min: "0", max: "30", value: workingWeights[key] ?? 0 });
    slider.addEventListener("input", (e) => {
      workingWeights[key] = parseInt(e.target.value, 10);
      valueLabel.textContent = e.target.value;
      sumLabel.textContent = `Sum: ${weightSum(workingWeights)}`;
    });
    row.append(el("label", { style: "margin:0;" }, WEIGHT_LABELS[key]), slider, valueLabel);
    weightPanel.appendChild(row);
  });
  weightPanel.appendChild(el("p", { class: "txt-muted", style: "font-size:11px;" }, ["Weights are used proportionally — they don't need to sum to 100. ", sumLabel]));
  weightPanel.appendChild(
    el("div", { class: "flex gap-8 mt-8" }, [
      el("button", { class: "btn btn-primary", onclick: () => { saveWeights(workingWeights); toast("Scoring weights saved. Re-open Ranked Candidates to see updated scores.", "success"); } }, "Save Weights"),
      el("button", { class: "btn", onclick: () => { saveWeights({ ...DEFAULT_WEIGHTS }); renderSettings(container); } }, "Reset to Defaults"),
    ])
  );
  container.appendChild(weightPanel);

  /* ---- Data management ---- */
  const dataPanel = el("div", { class: "panel mt-16" }, [
    el("div", { class: "panel-title" }, "Data"),
    el("p", { class: "txt-muted" }, "All data (candidates, journal, settings) is stored locally in this browser. Export a backup before clearing browser storage."),
    el("div", { class: "flex gap-8" }, [
      el("button", { class: "btn", onclick: exportBackup }, "Export Backup (JSON)"),
      el("button", { class: "btn btn-danger", onclick: () => {
        if (confirm("This clears ALL app data (candidates, journal, settings) from this browser. This cannot be undone. Continue?")) {
          localStorage.clear();
          toast("All data cleared.", "success");
          location.reload();
        }
      } }, "Clear All App Data"),
    ]),
  ]);
  container.appendChild(dataPanel);
}

function exportBackup() {
  const data = Store.exportAll();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `swing-terminal-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}


/* ===== js/app.js ===== */

const VIEWS = {
  dashboard: { title: "Dashboard", icon: "◈", render: renderDashboard },
  import: { title: "Scanner Import", icon: "⇪", render: renderScannerImport },
  library: { title: "Scanner Library", icon: "☰", render: renderScannerLibrary },
  candidates: { title: "Ranked Candidates", icon: "▤", render: (c) => renderCandidates(c, openWorkspace) },
  intel: { title: "Market Intelligence", icon: "◒", render: renderMarketIntel },
  workspace: { title: "Trade Workspace", icon: "◎", render: (c) => renderTradeWorkspace(c, activeCandidateId, () => navigate("journal")) },
  journal: { title: "Journal", icon: "▥", render: renderJournal },
  analytics: { title: "Analytics", icon: "▦", render: renderAnalytics },
  settings: { title: "Settings", icon: "⚙", render: renderSettings },
};

let activeView = "dashboard";
let activeCandidateId = null;

function navigate(viewKey) {
  activeView = viewKey;
  $$(".nav-item").forEach((btn) => btn.classList.toggle("is-active", btn.dataset.nav === viewKey));
  $$(".view").forEach((v) => v.classList.remove("is-active"));
  const container = $(`#view-${viewKey}`);
  container.classList.add("is-active");
  VIEWS[viewKey].render(container);
}

function openWorkspace(candidateId) {
  activeCandidateId = candidateId;
  navigate("workspace");
}

function buildSidebar() {
  const nav = $("#sidebar-nav");
  const groups = [
    { label: "Overview", items: ["dashboard"] },
    { label: "Research", items: ["import", "library", "candidates", "intel"] },
    { label: "Execute", items: ["workspace"] },
    { label: "Track", items: ["journal", "analytics"] },
    { label: "System", items: ["settings"] },
  ];
  groups.forEach((group) => {
    nav.appendChild(el("div", { class: "nav-group-label" }, group.label));
    group.items.forEach((key) => {
      const item = VIEWS[key];
      const btn = el("button", { class: "nav-item", "data-nav": key, onclick: () => navigate(key) }, [
        el("span", { class: "nav-icon" }, item.icon),
        el("span", {}, item.title),
      ]);
      nav.appendChild(btn);
    });
  });
}

function buildViewContainers() {
  const main = $("#main-content");
  Object.keys(VIEWS).forEach((key) => {
    main.appendChild(el("section", { class: "view", id: `view-${key}` }));
  });
}

async function buildRibbon() {
  const ribbon = $("#ribbon");
  // Genuinely live index prices — free TradingView widget, no API key needed.
  renderTickerTape(ribbon, DEFAULT_INDEX_TICKER_SYMBOLS);

  // Market-context bias for the scoring engine still uses the sample data
  // service (see docs/ARCHITECTURE.md) since a free live breadth/VIX feed
  // isn't available without a paid vendor — this is separate from the
  // ribbon above, which now shows real prices.
  const indices = await getIndexSnapshot();
  await refreshMarketBiasFromSnapshot(indices);
}

function updateCandidateBadge() {
  const badge = document.querySelector('.nav-item[data-nav="candidates"] .nav-badge') || (() => {
    const b = el("span", { class: "nav-badge" });
    document.querySelector('.nav-item[data-nav="candidates"]').appendChild(b);
    return b;
  })();
  badge.textContent = String(getCandidates().length);
}

function init() {
  buildSidebar();
  buildViewContainers();
  buildRibbon();
  updateCandidateBadge();
  navigate("dashboard");
  setInterval(updateCandidateBadge, 4000);
}

document.addEventListener("DOMContentLoaded", init);

</script>
