name: Sync NSE market data

# Runs automatically every trading-day evening after NSE's Bhavcopy is
# published (~8 PM IST / 14:30 UTC — we run a bit later to be safe), and can
# also be triggered manually from the Actions tab if you want a fresh sync
# right now (e.g. after fixing something).
on:
  schedule:
    - cron: "0 16 * * 1-5"   # 16:00 UTC = 21:30 IST, Mon–Fri
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Run sync
        run: python3 tools/sync_market_data.py

      - name: Commit updated data
        run: |
          git config user.name "market-data-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live
          git diff --quiet && git diff --staged --quiet || git commit -m "Sync market data $(date -u +'%Y-%m-%d')"
          git push

      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
